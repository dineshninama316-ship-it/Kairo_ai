<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIRA AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#05070d;
    color:white;
    min-height:100vh;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #1d2635;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.online{
    color:#35e88a;
    font-size:13px;
}

.usage{
    background:#111827;
    padding:8px 12px;
    border-radius:10px;
}

.chat{
    min-height:calc(100vh - 150px);
    padding:25px 15px 120px;
    max-width:800px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin-top:80px;
}

.welcome h1{
    font-size:35px;
    margin-bottom:15px;
}

.welcome p{
    color:#9ca3af;
}

.message{
    padding:14px 16px;
    margin:12px 0;
    border-radius:14px;
    max-width:85%;
    line-height:1.5;
    white-space:pre-wrap;
}

.user{
    margin-left:auto;
    background:#182235;
}

.kaira{
    margin-right:auto;
    background:#101722;
    border:1px solid #1d2b3d;
}

.bottom-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#05070d;
    border-top:1px solid #1d2635;
    padding:12px;
}

.input-area{
    max-width:800px;
    margin:auto;
    display:flex;
    gap:8px;
}

#messageInput{
    flex:1;
    background:#111827;
    color:white;
    border:1px solid #263244;
    border-radius:12px;
    padding:14px;
    outline:none;
    font-size:15px;
}

.action-btn{
    width:48px;
    border:0;
    border-radius:12px;
    background:#151e2d;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.action-btn:active{
    transform:scale(.95);
}

.send-btn{
    background:#2563eb;
}

#modeText{
    max-width:800px;
    margin:7px auto 0;
    text-align:center;
    color:#697586;
    font-size:12px;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <div class="logo">KAIRA</div>

    <div class="online">● ONLINE</div>

    <div class="usage">
        📊 <span id="usageCount">0</span>
    </div>

</div>


<!-- ================= CHAT ================= -->

<div class="chat" id="chatArea">

    <div class="welcome" id="welcome">

        <h1>नमस्ते Kaira 👋</h1>

        <p>
            नमस्ते बॉस! मैं KAIRA हूँ।<br>
            बताइए, आज मैं आपकी क्या मदद कर सकती हूँ?
        </p>

    </div>

</div>


<!-- ================= INPUT ================= -->

<div class="bottom-area">

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="KAIRA से कुछ पूछें..."
            autocomplete="off"
        >

        <!-- SCREEN VISION -->

        <button
            class="action-btn"
            id="screenVisionBtn"
            onclick="analyzeScreen()"
            title="Screen Vision">
            🖥️
        </button>

        <!-- VOICE -->

        <button
            class="action-btn"
            id="voiceBtn"
            onclick="startVoice()"
            title="Voice">
            🎙️
        </button>

        <!-- SEND -->

        <button
            class="action-btn send-btn"
            onclick="askKaira()"
            title="Send">
            ➤
        </button>

    </div>

    <div id="modeText">
        Text mode • 🎙️ दबाकर voice में बात करें
    </div>

</div>


<!-- =====================================================
     KAIRA JAVASCRIPT
===================================================== -->

<script>

const input = document.getElementById("messageInput");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");
const usageCount = document.getElementById("usageCount");
const modeText = document.getElementById("modeText");

let usage = Number(localStorage.getItem("kaira_usage") || 0);

updateUsage();


/* ================= USAGE ================= */

function updateUsage(){

    usageCount.textContent = usage;

}

function countRequest(){

    usage++;

    localStorage.setItem("kaira_usage", usage);

    updateUsage();

}


/* ================= MESSAGE ================= */

function addMessage(text, type){

    if(welcome){
        welcome.style.display = "none";
    }

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chatArea.appendChild(div);

    chatArea.scrollTop = chatArea.scrollHeight;

    return div;
}


/* ================= WEATHER ================= */

async function getWeather(){

    try{

        if(!navigator.geolocation){
            return null;
        }

        const position = await new Promise((resolve,reject)=>{

            navigator.geolocation.getCurrentPosition(
                resolve,
                reject,
                {
                    timeout:5000
                }
            );

        });

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
        );

        const data = await response.json();

        return data.current;

    }catch(error){

        return null;

    }

}


/* ================= ASK KAIRA ================= */

async function askKaira(){

    const message = input.value.trim();

    if(!message){
        return;
    }

    addMessage(message,"user");

    input.value = "";

    countRequest();

    const loading = addMessage("KAIRA सोच रही है...","kaira");

    try{

        const weather = await getWeather();

        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:message,

                weather:weather,

                image:null

            })

        });

        const data = await response.json();

        loading.remove();

        if(data.reply){

            addMessage(data.reply,"kaira");

            speakKaira(data.reply);

        }else{

            addMessage(
                data.error || "माफ़ कीजिए, अभी जवाब नहीं मिल पाया।",
                "kaira"
            );

        }

    }catch(error){

        loading.remove();

        addMessage(
            "Server से connection नहीं हो पाया।",
            "kaira"
        );

        console.error(error);

    }

}


/* ================= ENTER KEY ================= */

input.addEventListener("keydown",(event)=>{

    if(event.key === "Enter"){

        askKaira();

    }

});


/* ================= VOICE ================= */

function speakKaira(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "hi-IN";

    speech.rate = 1;

    speech.pitch = 1;

    speechSynthesis.speak(speech);

}


function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("आपके browser में Voice Recognition support नहीं है।");

        return;

    }

    const recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";

    recognition.interimResults = false;

    recognition.continuous = false;

    modeText.textContent = "🎙️ सुन रही हूँ...";

    recognition.start();

    recognition.onresult = function(event){

        const transcript =
            event.results[0][0].transcript;

        input.value = transcript;

        modeText.textContent =
            "Voice detected • जवाब भेज रही हूँ...";

        askKaira();

    };

    recognition.onerror = function(){

        modeText.textContent =
            "Voice mode • 🎙️ दबाकर फिर बोलें";

    };

    recognition.onend = function(){

        modeText.textContent =
            "Text mode • 🎙️ दबाकर voice में बात करें";

    };

}


/* =====================================================
   SCREEN VISION
===================================================== */

async function analyzeScreen(){

    modeText.textContent =
        "🖥️ Screen permission माँगी जा रही है...";

    try{

        if(!navigator.mediaDevices ||
           !navigator.mediaDevices.getDisplayMedia){

            alert(
                "इस browser/device में Screen Sharing support नहीं है।"
            );

            modeText.textContent =
                "Screen Vision supported नहीं है";

            return;

        }


        const stream =
            await navigator.mediaDevices.getDisplayMedia({

                video:true,

                audio:false

            });


        const video = document.createElement("video");

        video.srcObject = stream;

        video.muted = true;

        await video.play();


        await new Promise(resolve =>
            setTimeout(resolve,1000)
        );


        const canvas =
            document.createElement("canvas");

        canvas.width = video.videoWidth;

        canvas.height = video.videoHeight;


        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL("image/jpeg",0.8);


        stream.getTracks().forEach(
            track => track.stop()
        );


        modeText.textContent =
            "🖥️ Screen समझ रही हूँ...";


        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:
                    "इस screen को देखकर बताओ कि इसमें क्या दिखाई दे रहा है।",

                weather:null,

                image:image

            })

        });


        const data = await response.json();


        if(data.reply){

            addMessage(
                "🖥️ Screen Analysis:\n\n" +
                data.reply,
                "kaira"
            );

            speakKaira(data.reply);

        }else{

            addMessage(
                data.error ||
                "Screen analysis नहीं हो पाया।",
                "kaira"
            );

        }


        modeText.textContent =
            "Text mode • 🎙️ दबाकर voice में बात करें";


    }catch(error){

        console.error(error);

        modeText.textContent =
            "Screen Vision cancelled/error";

        addMessage(
            "🖥️ Screen permission नहीं मिली या sharing cancel हो गई।",
            "kaira"
        );

    }

}


/* ================= CAMERA PLACEHOLDER ================= */

async function startCamera(){

    alert(
        "Camera Vision अगला feature है।"
    );

}

function stopCamera(){

}

function captureCurrentFrame(){

}

async function analyzeCamera(){

    alert(
        "Camera Vision अभी setup होना बाकी है।"
    );

}


/* ================= GLOBAL ================= */

window.askKaira = askKaira;
window.startVoice = startVoice;
window.analyzeScreen = analyzeScreen;
window.startCamera = startCamera;
window.stopCamera = stopCamera;
window.analyzeCamera = analyzeCamera;

</script>

</body>
</html>
