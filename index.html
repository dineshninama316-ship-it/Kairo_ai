<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KAIRA AI</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body{

    background:#050812;

    color:#fff;

    min-height:100vh;

}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;

    max-width:1100px;

    height:100vh;

    margin:auto;

    display:flex;

    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            #07101f,
            #03060d
        );

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    border-bottom:
        1px solid #16243a;

    background:#07101c;

}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

}


.logoIcon{

    width:42px;

    height:42px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #38bdf8,
            #2563eb,
            #111827
        );

    box-shadow:
        0 0 25px #168cff;

    animation:
        logoPulse 3s infinite;

}


@keyframes logoPulse{

    50%{

        transform:scale(1.06);

        box-shadow:
            0 0 40px #168cff;

    }

}


.logoText h1{

    font-size:20px;

    letter-spacing:2px;

}


.online{

    font-size:11px;

    color:#35e68b;

    margin-top:3px;

}


.usage{

    font-size:11px;

    color:#8fa3bd;

}


/* =====================================================
   CHAT
===================================================== */

.chat{

    flex:1;

    overflow-y:auto;

    padding:
        20px
        14px
        110px;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

    text-align:center;

    margin:
        30px
        auto;

    max-width:500px;

}


.orb{

    width:95px;

    height:95px;

    margin:auto;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #8be9ff,
            #168cff,
            #0b1020
        );

    box-shadow:
        0 0 25px #168cff,
        0 0 70px
        rgba(
            22,
            140,
            255,
            .35
        );

    animation:
        pulse 3s infinite;

}


@keyframes pulse{

    50%{

        transform:scale(1.05);

        box-shadow:
            0 0 50px #168cff;

    }

}


.welcome h2{

    margin-top:18px;

    font-size:25px;

}


.welcome p{

    margin-top:8px;

    color:#91a4bd;

}


/* =====================================================
   MESSAGE
===================================================== */

.messageRow{

    display:flex;

    margin:12px 0;

}


.messageRow.user{

    justify-content:flex-end;

}


.message{

    max-width:82%;

    padding:
        13px
        15px;

    border-radius:17px;

    line-height:1.5;

    font-size:15px;

    white-space:pre-wrap;

    word-break:break-word;

}


.message.ai{

    background:#0c1728;

    border:
        1px solid #19304d;

    border-bottom-left-radius:5px;

}


.message.user{

    background:#125aa0;

    border-bottom-right-radius:5px;

}


/* =====================================================
   TOOLS
===================================================== */

.tools{

    display:flex;

    gap:8px;

    padding:
        8px
        12px;

    overflow-x:auto;

    background:#050812;

}


.tool{

    white-space:nowrap;

    border:
        1px solid #1b3554;

    background:#0a1422;

    color:#b9d5f3;

    padding:
        9px
        13px;

    border-radius:20px;

    cursor:pointer;

    transition:.2s;

}


.tool:hover{

    background:#102641;

    transform:translateY(-1px);

}


/* =====================================================
   BOTTOM INPUT
===================================================== */

.bottom{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    max-width:1100px;

    margin:auto;

    z-index:20;

    background:
        linear-gradient(
            transparent,
            #050812 25%
        );

    padding:
        15px
        12px;

}


.inputBox{

    display:flex;

    align-items:center;

    gap:8px;

    background:#0b1422;

    border:
        1px solid #1d3655;

    border-radius:18px;

    padding:8px;

}


.inputBox textarea{

    flex:1;

    resize:none;

    border:0;

    outline:none;

    background:transparent;

    color:#fff;

    font-size:15px;

    min-height:42px;

    max-height:110px;

    padding:10px;

}


.inputBox textarea::placeholder{

    color:#71859e;

}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

    width:45px;

    height:45px;

    border:0;

    border-radius:14px;

    cursor:pointer;

    color:#fff;

    background:#12365a;

    font-size:19px;

    transition:.2s;

}


.btn:hover{

    background:#175486;

    transform:scale(1.04);

}


.voice.active{

    background:#e11d48;

    box-shadow:
        0 0 20px
        rgba(
            225,
            29,
            72,
            .6
        );

}


.send{

    background:#1269b0;

}


/* =====================================================
   CAMERA
===================================================== */

.cameraBox{

    display:none;

    position:fixed;

    inset:0;

    z-index:50;

    background:
        rgba(
            0,
            0,
            0,
            .88
        );

    align-items:center;

    justify-content:center;

    padding:15px;

}


.cameraPanel{

    width:100%;

    max-width:700px;

    background:#07101d;

    border:
        1px solid #21466d;

    border-radius:20px;

    padding:15px;

    box-shadow:
        0 0 40px
        rgba(
            22,
            140,
            255,
            .2
        );

}


.cameraPanel video{

    width:100%;

    max-height:65vh;

    object-fit:contain;

    background:#000;

    border-radius:14px;

}


.cameraButtons{

    display:flex;

    gap:10px;

    margin-top:12px;

}


.cameraButtons button{

    flex:1;

    padding:12px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

}


.analyze{

    background:#168cff;

    color:#fff;

}


.close{

    background:#273548;

    color:#fff;

}


/* =====================================================
   TYPING
===================================================== */

.typing{

    display:flex;

    gap:5px;

    padding:8px;

}


.dot{

    width:7px;

    height:7px;

    background:#5ebeff;

    border-radius:50%;

    animation:
        typing .8s infinite;

}


.dot:nth-child(2){

    animation-delay:.15s;

}


.dot:nth-child(3){

    animation-delay:.3s;

}


@keyframes typing{

    50%{

        opacity:.2;

        transform:
            translateY(-3px);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

        height:62px;

        padding:
            0 12px;

    }


    .logoIcon{

        width:36px;

        height:36px;

    }


    .logoText h1{

        font-size:18px;

    }


    .message{

        max-width:90%;

    }


    .chat{

        padding-top:12px;

    }


    .welcome{

        margin-top:20px;

    }


    .welcome h2{

        font-size:21px;

    }


    .tools{

        padding-bottom:6px;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">

        <div class="logoIcon"></div>

        <div class="logoText">

            <h1>KAIRA</h1>

            <div class="online">
                ● ONLINE
            </div>

        </div>

    </div>


    <div class="usage">

        AI Usage:

        <span id="usage">
            0
        </span>

    </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<main
    class="chat"
    id="chat"
>

    <div class="welcome">

        <div class="orb"></div>

        <h2>
            नमस्ते 👋 मैं KAIRA हूँ।
        </h2>

        <p>
            आप मुझसे कुछ भी पूछ सकते हो।
        </p>

    </div>

</main>


<!-- =====================================================
     TOOLS
===================================================== -->

<div class="tools">

    <button
        class="tool"
        onclick="openCamera()"
    >
        📷 Camera
    </button>


    <button
        class="tool"
        onclick="analyzeScreen()"
    >
        🖥️ Screen Vision
    </button>


    <button
        class="tool"
        onclick="startVoice()"
    >
        🎤 Voice Command
    </button>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="bottom">

    <div class="inputBox">

        <textarea
            id="messageInput"
            placeholder="KAIRA से कुछ पूछें..."
            rows="1"
            onkeydown="handleEnter(event)"
        ></textarea>


        <button
            class="btn voice"
            id="voiceBtn"
            onclick="startVoice()"
            title="Voice"
        >
            🎤
        </button>


        <button
            class="btn send"
            onclick="sendMessage()"
            title="Send"
        >
            ➤
        </button>

    </div>

</div>


<!-- =====================================================
     CAMERA
===================================================== -->

<div
    class="cameraBox"
    id="cameraBox"
>

    <div class="cameraPanel">

        <video
            id="cameraVideo"
            autoplay
            playsinline
        ></video>


        <div class="cameraButtons">

            <button
                class="analyze"
                onclick="analyzeCamera()"
            >
                🔍 Analyze
            </button>


            <button
                class="close"
                onclick="closeCamera()"
            >
                ✕ Close
            </button>

        </div>

    </div>

</div>


</div>


<script>

/* =====================================================
   KAIRA USER ID
===================================================== */

/*
 * IMPORTANT:
 *
 * Neon में अभी Ajay की memory:
 *
 * user_id = test-user
 *
 * इसलिए फिलहाल website भी उसी user ID
 * का उपयोग करेगी।
 *
 * इससे:
 *
 * test-user
 *      ↓
 * name
 *      ↓
 * Ajay
 *
 * सीधे match होगा।
 *
 * बाद में जब proper login/account system
 * बनाएँगे तब इसे dynamic किया जा सकता है।
 */

const userId = "test-user";


/*
 * पुराने random userId को हटाकर
 * सही userId save कर दें।
 */

try {

    localStorage.setItem(
        "kairaUserId",
        userId
    );

} catch(error) {

    console.log(
        "LocalStorage unavailable"
    );

}


/* =====================================================
   USAGE
===================================================== */

let usage =
    Number(
        localStorage.getItem(
            "kairaNormalUsage"
        )
    ) || 0;


document.getElementById(
    "usage"
).textContent =
    usage;


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    text,
    type
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "messageRow " +
        (
            type === "user"
                ? "user"
                : ""
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message " +
        (
            type === "user"
                ? "user"
                : "ai"
        );


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;


    return row;

}


/* =====================================================
   TYPING
===================================================== */

function showTyping() {

    const chat =
        document.getElementById(
            "chat"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "messageRow";


    row.id =
        "typingRow";


    row.innerHTML = `
        <div class="message ai">
            <div class="typing">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    `;


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


function hideTyping() {

    const typing =
        document.getElementById(
            "typingRow"
        );


    if (typing) {

        typing.remove();

    }

}


/* =====================================================
   WEATHER
===================================================== */

async function getWeather() {

    try {

        if (
            !navigator.geolocation
        ) {

            return null;

        }


        const position =
            await new Promise(
                (
                    resolve,
                    reject
                ) => {

                    navigator.geolocation
                        .getCurrentPosition(
                            resolve,
                            reject,
                            {

                                enableHighAccuracy:
                                    false,

                                timeout:
                                    5000,

                                maximumAge:
                                    600000

                            }
                        );

                }
            );


        const lat =
            position.coords.latitude;


        const lon =
            position.coords.longitude;


        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code`;


        const response =
            await fetch(
                url
            );


        if (
            !response.ok
        ) {

            return null;

        }


        return await response.json();

    } catch(error) {

        console.log(
            "Weather unavailable"
        );

        return null;

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    input.value = "";


    /* =================================================
       WEBSITE COMMAND
    ================================================= */

    if (
        handleVoiceCommand(
            message
        )
    ) {

        return;

    }


    /* =================================================
       USER MESSAGE
    ================================================= */

    addMessage(
        message,
        "user"
    );


    showTyping();


    try {

        const weather =
            await getWeather();


        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            userId:
                                userId,

                            weather:
                                weather

                        })

                }
            );


        const data =
            await response.json();


        hideTyping();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        const reply =
            data.reply ||
            "मुझे कोई जवाब नहीं मिला।";


        usage++;


        localStorage.setItem(
            "kairaNormalUsage",
            usage
        );


        document.getElementById(
            "usage"
        ).textContent =
            usage;


        addMessage(
            reply,
            "ai"
        );


        speak(
            reply
        );


    } catch(error) {

        hideTyping();


        console.error(
            "KAIRA ERROR:",
            error
        );


        const errorMessage =
            "माफ़ कीजिए, अभी KAIRA server से connection नहीं हो पाया।";


        addMessage(
            errorMessage,
            "ai"
        );


        speak(
            errorMessage
        );

    }

}


/* =====================================================
   ENTER
===================================================== */

function handleEnter(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =====================================================
   VOICE RECOGNITION
===================================================== */

let recognition = null;

let listening = false;


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        alert(
            "इस Browser में Voice Recognition उपलब्ध नहीं है। Chrome इस्तेमाल करें।"
        );

        return;

    }


    if (listening) {

        if (recognition) {

            recognition.stop();

        }

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "hi-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            listening =
                true;


            document
                .getElementById(
                    "voiceBtn"
                )
                .classList.add(
                    "active"
                );

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();


            document
                .getElementById(
                    "messageInput"
                )
                .value =
                text;


            if (
                handleVoiceCommand(
                    text
                )
            ) {

                document
                    .getElementById(
                        "messageInput"
                    )
                    .value = "";

                return;

            }


            sendMessage();

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Voice error:",
                event.error
            );


            listening =
                false;


            document
                .getElementById(
                    "voiceBtn"
                )
                .classList.remove(
                    "active"
                );

        };


    recognition.onend =
        function() {

            listening =
                false;


            document
                .getElementById(
                    "voiceBtn"
                )
                .classList.remove(
                    "active"
                );

        };


    try {

        recognition.start();

    } catch(error) {

        console.log(
            "Voice start error:",
            error
        );

    }

}


/* =====================================================
   VOICE COMMAND ROUTER
===================================================== */

function handleVoiceCommand(
    text
) {

    if (!text) {

        return false;

    }


    const command =
        text
            .toLowerCase()
            .trim();


    const openWords = [

        "खोलो",

        "खोल",

        "चलाओ",

        "ओपन",

        "open",

        "launch",

        "start"

    ];


    const hasOpenCommand =
        openWords.some(
            word =>
                command.includes(
                    word
                )
        );


    if (
        !hasOpenCommand
    ) {

        return false;

    }


    const sites = [

        {
            names: [
                "youtube",
                "यूट्यूब"
            ],

            url:
                "https://www.youtube.com/"
        },

        {
            names: [
                "google",
                "गूगल"
            ],

            url:
                "https://www.google.com/"
        },

        {
            names: [
                "instagram",
                "इंस्टाग्राम"
            ],

            url:
                "https://www.instagram.com/"
        },

        {
            names: [
                "whatsapp",
                "व्हाट्सएप"
            ],

            url:
                "https://web.whatsapp.com/"
        },

        {
            names: [
                "facebook",
                "फेसबुक"
            ],

            url:
                "https://www.facebook.com/"
        },

        {
            names: [
                "telegram",
                "टेलीग्राम"
            ],

            url:
                "https://web.telegram.org/"
        },

        {
            names: [
                "gmail",
                "जीमेल",
                "mail"
            ],

            url:
                "https://mail.google.com/"
        },

        {
            names: [
                "google maps",
                "maps",
                "मैप",
                "मैप्स"
            ],

            url:
                "https://maps.google.com/"
        },

        {
            names: [
                "tradingview",
                "trading view",
                "ट्रेडिंग व्यू"
            ],

            url:
                "https://www.tradingview.com/"
        },

        {
            names: [
                "github",
                "गिटहब"
            ],

            url:
                "https://github.com/"
        },

        {
            names: [
                "vercel",
                "वर्सेल"
            ],

            url:
                "https://vercel.com/"
        },

        {
            names: [
                "neon",
                "नियॉन"
            ],

            url:
                "https://console.neon.tech/"
        },

        {
            names: [
                "twitter",
                "ट्विटर",
                "x"
            ],

            url:
                "https://x.com/"
        }

    ];


    for (
        const site of sites
    ) {

        const found =
            site.names.some(
                name =>
                    command.includes(
                        name
                    )
            );


        if (found) {

            openWebsite(
                site.url,
                site.names[0]
            );


            return true;

        }

    }


    const message =
        "मैं अभी इस command को नहीं पहचान पाई। आप YouTube खोलो, Google खोलो, Instagram खोलो या TradingView खोलो बोल सकते हैं।";


    addMessage(
        message,
        "ai"
    );


    speak(
        message
    );


    return true;

}


/* =====================================================
   OPEN WEBSITE
===================================================== */

function openWebsite(
    url,
    name
) {

    const message =
        `${name} खोल रही हूँ।`;


    addMessage(
        message,
        "ai"
    );


    speak(
        message
    );


    const newTab =
        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );


    if (!newTab) {

        setTimeout(
            function() {

                window.location.href =
                    url;

            },
            500
        );

    }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "hi-IN";


    speech.rate =
        0.95;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   CAMERA
===================================================== */

let cameraStream =
    null;


async function openCamera() {

    try {

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "environment"

                    },

                    audio:
                        false

                });


        const video =
            document.getElementById(
                "cameraVideo"
            );


        video.srcObject =
            cameraStream;


        document.getElementById(
            "cameraBox"
        ).style.display =
            "flex";


    } catch(error) {

        console.error(
            "Camera error:",
            error
        );


        alert(
            "Camera permission नहीं मिली। Browser settings में Camera permission Allow करें।"
        );

    }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        cameraStream =
            null;

    }


    const video =
        document.getElementById(
            "cameraVideo"
        );


    video.srcObject =
        null;


    document.getElementById(
        "cameraBox"
    ).style.display =
        "none";

}


/* =====================================================
   CAPTURE CAMERA FRAME
===================================================== */

function captureCurrentFrame() {

    const video =
        document.getElementById(
            "cameraVideo"
        );


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return null;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const maxWidth =
        1280;


    let width =
        video.videoWidth;


    let height =
        video.videoHeight;


    if (
        width > maxWidth
    ) {

        height =
            Math.round(
                height *
                maxWidth /
                width
            );


        width =
            maxWidth;

    }


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.75
    );

}


/* =====================================================
   CAMERA ANALYSIS
===================================================== */

async function analyzeCamera() {

    const image =
        captureCurrentFrame();


    if (!image) {

        alert(
            "Camera image capture नहीं हो पाई।"
        );

        return;

    }


    const question =
        "इस camera image को ध्यान से देखकर बताओ कि इसमें क्या दिखाई दे रहा है।";


    closeCamera();


    addMessage(
        "📷 Camera image analyze करो",
        "user"
    );


    showTyping();


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                question,

                            image:
                                image,

                            userId:
                                userId

                        })

                }
            );


        const data =
            await response.json();


        hideTyping();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Vision error"
            );

        }


        const reply =
            data.reply ||
            "Image समझ नहीं आई।";


        addMessage(
            reply,
            "ai"
        );


        speak(
            reply
        );


    } catch(error) {

        hideTyping();


        console.error(
            "Camera analysis:",
            error
        );


        const msg =
            "Camera image analyze करते समय समस्या आ गई।";


        addMessage(
            msg,
            "ai"
        );


        speak(
            msg
        );

    }

}


/* =====================================================

            document.createElement(

            stream;

/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadMemory() {

    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "history",

                            userId:
                                userId

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            console.log(
                "History load error:",
                data.error
            );

            return;

        }


        if (
            !data.history ||
            !Array.isArray(
                data.history
            )
        ) {

            return;

        }


        const welcome =
            document.querySelector(
                ".welcome"
            );


        if (
            data.history.length > 0 &&
            welcome
        ) {

            welcome.remove();

        }


        data.history.forEach(
            item => {

                if (
                    item.role !== "user" &&
                    item.role !== "assistant"
                ) {

                    return;

                }


                addMessage(
                    item.message,

                    item.role === "user"
                        ? "user"
                        : "ai"

                );

            }
        );


    } catch(error) {

        console.log(
            "History unavailable:",
            error
        );

    }

}
