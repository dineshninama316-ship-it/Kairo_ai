<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAIRA AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        radial-gradient(circle at top,#10264a 0%,#07101f 35%,#030711 100%);
    color:white;
    min-height:100vh;
    overflow:hidden;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(4,10,22,.88);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    z-index:10;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
}

.orb{
    width:42px;
    height:42px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#ffffff 0%,#8ec5ff 8%,#3187ff 35%,#0751c9 65%,#021d57 100%);
    box-shadow:
        0 0 12px #2387ff,
        0 0 30px rgba(35,135,255,.5);
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 12px #2387ff,0 0 30px rgba(35,135,255,.5);
    }
    50%{
        transform:scale(1.06);
        box-shadow:0 0 20px #2387ff,0 0 45px rgba(35,135,255,.7);
    }
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
}

.online{
    font-size:11px;
    color:#53ff9d;
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.usage{
    font-size:12px;
    padding:8px 11px;
    border-radius:20px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    color:#bcd4f5;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px 14px 180px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#1c3d69;
    border-radius:10px;
}

.message{
    max-width:850px;
    margin:0 auto 16px;
    display:flex;
    gap:10px;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:min(82%,680px);
    padding:13px 15px;
    border-radius:18px;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.ai .bubble{
    background:rgba(15,31,57,.88);
    border:1px solid rgba(90,145,220,.15);
    border-top-left-radius:5px;
}

.user .bubble{
    background:linear-gradient(135deg,#1769d5,#0d4aa1);
    border-top-right-radius:5px;
    box-shadow:0 7px 25px rgba(0,85,190,.18);
}

.avatar{
    flex:none;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    background:#123c76;
    border:1px solid rgba(255,255,255,.12);
}

.user .avatar{
    display:none;
}

/* =========================
   WELCOME
========================= */

.welcome{
    min-height:55vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-box{
    max-width:650px;
}

.welcome-orb{
    width:105px;
    height:105px;
    margin:0 auto 22px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#fff 0%,#8ec5ff 8%,#2780ff 32%,#0749b7 60%,#02143d 100%);
    box-shadow:
        0 0 30px #2688ff,
        0 0 80px rgba(30,120,255,.35);
    animation:pulse 3s infinite;
}

.welcome h1{
    font-size:31px;
    margin-bottom:8px;
}

.welcome p{
    color:#a7bad5;
    font-size:15px;
}

/* =========================
   TYPING
========================= */

.typing{
    display:none;
    max-width:850px;
    margin:0 auto 15px;
    align-items:center;
    gap:10px;
}

.typing .avatar{
    display:flex;
}

.typing-bubble{
    padding:12px 15px;
    border-radius:18px;
    border-top-left-radius:5px;
    background:#0f1f39;
}

.dots{
    display:flex;
    gap:4px;
}

.dots span{
    width:6px;
    height:6px;
    background:#83b7ff;
    border-radius:50%;
    animation:dot 1.2s infinite;
}

.dots span:nth-child(2){
    animation-delay:.15s;
}

.dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* =========================
   TOOLS
========================= */

.tools{
    position:fixed;
    left:0;
    right:0;
    bottom:80px;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:8px 10px;
    z-index:5;
    pointer-events:none;
}

.tool-btn{
    pointer-events:auto;
    border:1px solid rgba(100,160,230,.15);
    background:rgba(8,19,37,.92);
    color:#d7e7ff;
    padding:9px 12px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
    backdrop-filter:blur(15px);
    transition:.2s;
}

.tool-btn:hover{
    background:#12345f;
    transform:translateY(-1px);
}

.tool-btn:active{
    transform:scale(.96);
}

/* =========================
   INPUT AREA
========================= */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:10px 12px 13px;
    background:linear-gradient(
        to top,
        #030711 70%,
        rgba(3,7,17,.85)
    );
    z-index:8;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    border-radius:25px;
    background:rgba(12,27,49,.96);
    border:1px solid rgba(90,150,230,.18);
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

#messageInput{
    flex:1;
    min-height:42px;
    max-height:120px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px 8px;
    font-size:15px;
}

#messageInput::placeholder{
    color:#7388a5;
}

.icon-btn{
    width:42px;
    height:42px;
    flex:none;
    border:0;
    border-radius:50%;
    background:#102c50;
    color:#dcecff;
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.icon-btn:hover{
    background:#174b84;
}

.send-btn{
    background:linear-gradient(135deg,#2384ff,#0752c7);
    box-shadow:0 5px 18px rgba(20,110,255,.3);
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,100%);
    background:#091426;
    border:1px solid rgba(110,170,240,.2);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.modal-head h3{
    font-size:16px;
}

.close-btn{
    border:0;
    background:#172941;
    color:white;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
}

.camera-wrap{
    position:relative;
    background:black;
    aspect-ratio:4/3;
}

#cameraVideo,
#cameraCanvas{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

#cameraCanvas{
    display:none;
}

.modal-actions{
    display:flex;
    gap:8px;
    padding:12px;
}

.action-btn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:12px;
    background:#12345c;
    color:white;
    cursor:pointer;
}

.action-btn.primary{
    background:linear-gradient(135deg,#207df0,#0752c8);
}

/* =========================
   STATUS
========================= */

.status{
    text-align:center;
    font-size:11px;
    color:#667d9c;
    margin-top:4px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        height:62px;
        padding:0 11px;
    }

    .orb{
        width:36px;
        height:36px;
    }

    .logo{
        font-size:19px;
    }

    .usage{
        font-size:10px;
        padding:7px 9px;
    }

    .chat{
        padding:14px 9px 175px;
    }

    .bubble{
        max-width:86%;
        font-size:14px;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcome-orb{
        width:85px;
        height:85px;
    }

    .tools{
        bottom:76px;
        overflow-x:auto;
        justify-content:flex-start;
        padding-left:10px;
        scrollbar-width:none;
    }

    .tools::-webkit-scrollbar{
        display:none;
    }

    .tool-btn{
        white-space:nowrap;
    }

    .input-area{
        padding:7px 8px 10px;
    }

    .input-box{
        padding:5px;
    }

    #messageInput{
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo-area">

        <div class="orb"></div>

        <div>
            <div class="logo">KAIRA</div>
            <div class="online">● ONLINE</div>
        </div>

    </div>

    <div class="header-right">

        <div class="usage">
            AI Usage: <span id="usageCount">0</span>
        </div>

    </div>

</header>


<!-- =========================
     CHAT
========================= -->

<main id="chat" class="chat">

    <div id="welcome" class="welcome">

        <div class="welcome-box">

            <div class="welcome-orb"></div>

            <h1>नमस्ते 👋 मैं KAIRA हूँ</h1>

            <p>
                आपका Personal AI Assistant.<br>
                आप मुझसे कुछ भी पूछ सकते हो।
            </p>

        </div>

    </div>

</main>


<!-- =========================
     TYPING
========================= -->

<div id="typing" class="typing">

    <div class="avatar">K</div>

    <div class="typing-bubble">

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>


<!-- =========================
     TOOLS
========================= -->

<div class="tools">

    <button class="tool-btn" onclick="openCamera()">
        📷 Camera
    </button>

    <button class="tool-btn" onclick="analyzeScreen()">
        🖥️ Screen Vision
    </button>

    <button class="tool-btn" onclick="startVoice()">
        🎤 Voice Command
    </button>

</div>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">

    <div class="input-box">

        <button
            class="icon-btn"
            onclick="startVoice()"
            title="Voice"
        >
            🎤
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="KAIRA से कुछ पूछें..."
            autocomplete="off"
        ></textarea>

        <button
            id="sendBtn"
            class="icon-btn send-btn"
            onclick="sendMessage()"
            title="Send"
        >
            ➤
        </button>

    </div>

    <div class="status" id="statusText">
        KAIRA सुरक्षित रूप से आपकी मदद करने के लिए तैयार है
    </div>

</div>


<!-- =========================
     CAMERA MODAL
========================= -->

<div id="cameraModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <h3>📷 KAIRA Camera Vision</h3>

            <button
                class="close-btn"
                onclick="closeCamera()"
            >
                ✕
            </button>

        </div>

        <div class="camera-wrap">

            <video
                id="cameraVideo"
                autoplay
                playsinline
            ></video>

            <canvas id="cameraCanvas"></canvas>

        </div>

        <div class="modal-actions">

            <button
                class="action-btn"
                onclick="captureCurrentFrame()"
            >
                📸 Capture
            </button>

            <button
                class="action-btn primary"
                onclick="analyzeCamera()"
            >
                🧠 Analyze
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   KAIRA AI FRONTEND
   Groq + Neon Permanent Memory
===================================================== */


/* =====================================================
   USER ID
===================================================== */

/*
   अभी single-user testing के लिए test-user रखा है।

   Neon में आपकी memory भी test-user के अंदर है,
   इसलिए KAIRA उसे पढ़ पाएगी।
*/

const userId = "test-user";

localStorage.setItem("kairaUserId", userId);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let isSending = false;
let historyLoaded = false;
let cameraStream = null;
let screenStream = null;
let recognition = null;
let listening = false;

let normalUsage =
    Number(localStorage.getItem("kairaNormalUsage") || 0);

let visionUsage =
    Number(localStorage.getItem("kairaVisionUsage") || 0);

let weatherCache = null;


/* =====================================================
   DOM
===================================================== */

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const typing =
    document.getElementById("typing");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const usageCount =
    document.getElementById("usageCount");

const statusText =
    document.getElementById("statusText");

const cameraModal =
    document.getElementById("cameraModal");

const cameraVideo =
    document.getElementById("cameraVideo");

const cameraCanvas =
    document.getElementById("cameraCanvas");


/* =====================================================
   USAGE
===================================================== */

function updateUsage(){

    usageCount.textContent =
        normalUsage + visionUsage;

    localStorage.setItem(
        "kairaNormalUsage",
        normalUsage
    );

    localStorage.setItem(
        "kairaVisionUsage",
        visionUsage
    );
}

updateUsage();


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    statusText.textContent = text;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(role, text){

    if(!text) return;

    if(welcome){
        welcome.style.display = "none";
    }

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "ai" ? "K" : "U";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(avatar);
    message.appendChild(bubble);

    chat.appendChild(message);

    scrollToBottom();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    typing.style.display = "flex";

    scrollToBottom();

}

function hideTyping(){

    typing.style.display = "none";

}


/* =====================================================
   AUTO RESIZE TEXTAREA
===================================================== */

input.addEventListener(
    "input",
    function(){

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight,120) + "px";

    }
);


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   WEATHER
===================================================== */

async function getWeather(){

    if(weatherCache){
        return weatherCache;
    }

    if(!navigator.geolocation){
        return null;
    }

    try{

        const position =
            await new Promise(
                (resolve,reject)=>{

                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            enableHighAccuracy:false,
                            timeout:8000,
                            maximumAge:600000
                        }
                    );

                }
            );

        const lat =
            position.coords.latitude;

        const lon =
            position.coords.longitude;

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + lat +
            "&longitude=" + lon +
            "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
            "&timezone=auto";

        const response =
            await fetch(url);

        if(!response.ok){
            return null;
        }

        const data =
            await response.json();

        if(!data.current){
            return null;
        }

        weatherCache = {

            temperature:
                data.current.temperature_2m,

            feelsLike:
                data.current.apparent_temperature,

            humidity:
                data.current.relative_humidity_2m,

            wind:
                data.current.wind_speed_10m,

            code:
                data.current.weather_code

        };

        return weatherCache;

    }catch(error){

        console.log(
            "Weather unavailable:",
            error
        );

        return null;
    }

}


/* =====================================================
   WEATHER TEXT
===================================================== */

function weatherCodeText(code){

    const map = {

        0:"साफ आसमान",

        1:"मुख्यतः साफ",

        2:"आंशिक बादल",

        3:"बादल",

        45:"कोहरा",

        48:"कोहरा",

        51:"हल्की बूंदाबांदी",

        53:"बूंदाबांदी",

        55:"तेज बूंदाबांदी",

        61:"हल्की बारिश",

        63:"बारिश",

        65:"तेज बारिश",

        71:"हल्की बर्फबारी",

        73:"बर्फबारी",

        75:"तेज बर्फबारी",

        80:"बारिश की बौछार",

        81:"बारिश की बौछार",

        82:"तेज बारिश की बौछार",

        95:"गरज के साथ बारिश",

        96:"गरज के साथ ओले",

        99:"गरज के साथ ओले"

    };

    return map[code] || "मौसम की जानकारी उपलब्ध है";

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(isSending){
        return;
    }

    const message =
        input.value.trim();

    if(!message){
        return;
    }

    addMessage("user",message);

    input.value = "";
    input.style.height = "auto";

    isSending = true;

    sendBtn.disabled = true;

    showTyping();

    setStatus("KAIRA सोच रही है...");

    try{

        /*
          पहले voice website commands check
        */

        const commandHandled =
            handleVoiceCommand(message);

        if(commandHandled){

            hideTyping();

            setStatus("KAIRA तैयार है");

            return;
        }


        /*
          Weather context
        */

        let weather = null;

        if(
            /मौसम|weather|temperature|तापमान|बारिश|rain|गरमी|ठंड/i
            .test(message)
        ){

            weather =
                await getWeather();

        }


        /*
          Backend
        */

        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:message,

                        userId:userId,

                        weather:weather

                    })

                }
            );


        /*
          Response JSON
        */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";

        let data;

        if(contentType.includes("application/json")){

            data =
                await response.json();

        }else{

            const text =
                await response.text();

            throw new Error(
                text ||
                "Server ने valid JSON नहीं दिया।"
            );

        }


        if(!response.ok){

            throw new Error(
                data?.error ||
                "Server error"
            );

        }


        const reply =
            data.reply ||
            data.message ||
            data.response ||
            "मुझे अभी जवाब नहीं मिला।";


        hideTyping();

        addMessage(
            "ai",
            reply
        );


        normalUsage++;

        updateUsage();

        setStatus(
            "KAIRA ONLINE • Memory Active"
        );


        /*
          Hindi voice reply
        */

        speak(reply);


    }catch(error){

        console.error(error);

        hideTyping();

        addMessage(
            "ai",
            "माफ़ कीजिए बॉस 😕 अभी server से connection में problem आ रही है। एक बार फिर कोशिश करो।"
        );

        setStatus(
            "Connection error"
        );

    }finally{

        isSending = false;

        sendBtn.disabled = false;

        input.focus();

    }

}


/* =====================================================
   WEBSITE COMMANDS
===================================================== */

function handleVoiceCommand(text){

    const t =

/* =====================================================
   OPEN WEBSITE
===================================================== */

function openWebsite(url){

    const newWindow =
        window.open(
            url,
            "_blank"
        );

    if(!newWindow){

        window.location.href = url;

    }

}


/* =====================================================
   VOICE RECOGNITION
===================================================== */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "इस Browser में Voice Recognition उपलब्ध नहीं है। Chrome इस्तेमाल करें।"
        );

        return;
    }


    if(listening){

        if(recognition){

            recognition.stop();

        }

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "hi-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    listening = true;

    setStatus(
        "🎤 KAIRA सुन रही है..."
    );


    recognition.onstart =
        function(){

            listening = true;

        };


    recognition.onresult =
        function(event){

            const transcript =
                event.results[0][0].transcript;

            input.value =
                transcript;

            input.dispatchEvent(
                new Event("input")
            );

            setStatus(
                "Voice command मिला"
            );

            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                "Voice error:",
                event.error
            );

            setStatus(
                "Voice में problem हुई"
            );

        };


    recognition.onend =
        function(){

            listening = false;

            if(
                !isSending
            ){

                setStatus(
                    "KAIRA तैयार है"
                );

            }

        };


    try{

        recognition.start();

    }catch(error){

        console.error(error);

        listening = false;

        setStatus(
            "Voice start नहीं हो पाई"
        );

    }

}


/* =====================================================
   SPEECH SYNTHESIS
===================================================== */

function speak(text){

    if(
        !window.speechSynthesis ||
        !text
    ){

        return;
    }


    try{

        window.speechSynthesis.cancel();


        const cleanText =
            text
                .replace(/[*#_`]/g,"")
                .replace(/\n+/g," ");


        const utterance =
            new SpeechSynthesisUtterance(
                cleanText
            );


        utterance.lang =
            "hi-IN";

        utterance.rate =
            0.95;

        utterance.pitch =
            1.05;

        utterance.volume =
            1;


        const voices =
            window.speechSynthesis.getVoices();


        const hindiVoice =
            voices.find(
                voice =>
                    voice.lang &&
                    voice.lang
                        .toLowerCase()
                        .startsWith("hi")
            );


        if(hindiVoice){

            utterance.voice =
                hindiVoice;

        }


        window.speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.log(
            "Speech error:",
            error
        );

    }

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    cameraModal.classList.add(
        "show"
    );

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        cameraVideo.srcObject =
            cameraStream;

        await cameraVideo.play();

        setStatus(
            "Camera ON"
        );

    }catch(error){

        console.error(error);

        closeCamera();

        alert(
            "Camera permission नहीं मिली या camera उपलब्ध नहीं है।"
        );

    }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream = null;

    }


    cameraVideo.srcObject =
        null;

    cameraModal.classList.remove(
        "show"
    );

}


/* =====================================================
   CAPTURE CAMERA
===================================================== */

function captureCurrentFrame(){

    if(
        !cameraVideo.videoWidth ||
        !cameraVideo.videoHeight
    ){

        alert(
            "पहले camera चालू करें।"
        );

        return;
    }


    cameraCanvas.width =
        cameraVideo.videoWidth;

    cameraCanvas.height =
        cameraVideo.videoHeight;


    const ctx =
        cameraCanvas.getContext(
            "2d"
        );


    ctx.drawImage(
        cameraVideo,
        0,
        0,
        cameraCanvas.width,
        cameraCanvas.height
    );


    cameraVideo.style.display =
        "none";

    cameraCanvas.style.display =
        "block";


    setStatus(
        "Photo captured"
    );

}


/* =====================================================
   ANALYZE CAMERA
===================================================== */

async function analyzeCamera(){

    if(
        !cameraVideo.videoWidth ||
        !cameraVideo.videoHeight
    ){

        alert(
            "पहले camera चालू करें।"
        );

        return;
    }


    cameraCanvas.width =
        cameraVideo.videoWidth;

    cameraCanvas.height =
        cameraVideo.videoHeight;


    const ctx =
        cameraCanvas.getContext(
            "2d"
        );


    ctx.drawImage(
        cameraVideo,
        0,
        0,
        cameraCanvas.width,
        cameraCanvas.height
    );


    const image =
        cameraCanvas.toDataURL(
            "image/jpeg",
            .82
        );


    closeCamera();


    addMessage(
        "user",
        "📷 Camera image analyze करो।"
    );


    showTyping();

    setStatus(
        "KAIRA image देख रही है..."
    );


    try{

        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            "इस image को ध्यान से analyze करके हिंदी में बताओ कि इसमें क्या दिखाई दे रहा है।",

                        userId:userId,

                        image:image

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data?.error ||
                "Vision error"
            );

        }


        const reply =
            data.reply ||
            "Image analyze नहीं हो पाई।";


        hideTyping();

        addMessage(
            "ai",
            reply
        );


        visionUsage++;

        updateUsage();

        setStatus(
            "Vision analysis complete"
        );


        speak(reply);


    }catch(error){

        console.error(error);

        hideTyping();

        addMessage(
            "ai",
            "माफ़ कीजिए बॉस, image analyze करते समय problem आ गई।"
        );

        setStatus(
            "Vision error"
        );

    }

}


/* =====================================================
   SCREEN VISION
===================================================== */

async function analyzeScreen(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        alert(
            "इस Browser में Screen Vision उपलब्ध नहीं है।"
        );

        return;
    }


    try{

        setStatus(
            "Screen select करें..."
        );


        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video:true,

                audio:false

            });


        const video =
            document.createElement(
                "video"
            );


        video.srcObject =
            screenStream;

        video.muted =
            true;

        video.playsInline =
            true;


        await video.play();


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                .80
            );


        screenStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        screenStream = null;


        addMessage(
            "user",
            "🖥️ मेरी screen को analyze करो।"
        );


        showTyping();

        setStatus(
            "KAIRA screen analyze कर रही है..."
        );


        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            "इस screen को ध्यान से analyze करके हिंदी में बताओ कि इसमें क्या है और अगर कोई important information/error दिखाई दे तो बताओ।",

                        userId:userId,

                        image:image

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data?.error ||
                "Screen vision error"
            );

        }


        const reply =
            data.reply ||
            "Screen analyze नहीं हो पाई।";


        hideTyping();

        addMessage(
            "ai",
            reply
        );


        visionUsage++;

        updateUsage();

        setStatus(
            "Screen analysis complete"
        );


        speak(reply);


    }catch(error){

        console.error(error);

        if(screenStream){

            screenStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            screenStream = null;

        }

        hideTyping();

        addMessage(
            "ai",
            "Screen Vision cancel हो गया या browser ने permission नहीं दी।"
        );

        setStatus(
            "Screen Vision बंद"
        );

    }

}


/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadMemory(){

    if(historyLoaded){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:"history",

                        userId:userId

                    })

                }
            );


        if(!response.ok){
            return;
        }


        const data =
            await response.json();


        const history =
            Array.isArray(data.history)
                ? data.history
                : [];


        if(history.length > 0){

            if(welcome){
                welcome.style.display =
                    "none";
            }


            /*
              पुराने messages
            */

            history.forEach(
                item => {

                    if(
                        !item ||
                        !item.message
                    ){
                        return;
                    }


                    addMessage(
                        item.role === "user"
                            ? "user"
                            : "ai",

                        item.message
                    );

                }
            );

        }


        historyLoaded = true;


        setStatus(
            "KAIRA ONLINE • Memory Active"
        );


    }catch(error){

        console.log(
            "History load error:",
            error
        );

    }

}

/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden &&
            window.speechSynthesis
        ){

            window.speechSynthesis.cancel();

        }

    }
);


/* =====================================================
   PAGE UNLOAD CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(cameraStream){

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

        if(screenStream){

            screenStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

        if(
            window.speechSynthesis
        ){

            window.speechSynthesis.cancel();

        }

    }
);


/* =====================================================
   LOAD HINDI VOICES
===================================================== */

if(
    window.speechSynthesis
){

    window.speechSynthesis.onvoiceschanged =
        function(){

            window.speechSynthesis
                .getVoices();

        };

}
