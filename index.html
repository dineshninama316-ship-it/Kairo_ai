<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAIRA AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#020611;
    color:#fff;
    min-height:100vh;
    overflow:hidden;
}

/* Animated background */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,140,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,140,255,.08) 1px,transparent 1px);
    background-size:40px 40px;
    animation:gridMove 12s linear infinite;
    z-index:-3;
}

@keyframes gridMove{
    from{transform:translateY(0)}
    to{transform:translateY(40px)}
}

.glow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    z-index:-2;
}

.glow.one{
    background:#006eff;
    top:-100px;
    left:-80px;
}

.glow.two{
    background:#00d9ff;
    right:-100px;
    bottom:-100px;
}

/* Header */
header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid rgba(0,150,255,.25);
    background:rgba(2,8,20,.75);
    backdrop-filter:blur(12px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid #00aaff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 20px #008cff;
    font-weight:bold;
    color:#00c8ff;
}

.logo-text{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.status{
    font-size:12px;
    color:#00ff9d;
}

.usage{
    font-size:11px;
    color:#8bbcff;
    margin-top:3px;
}

/* Main */
.main{
    height:calc(100vh - 70px);
    display:flex;
    flex-direction:column;
}

/* AI area */
.ai-area{
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.ai-orb{
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid #00aaff;
    box-shadow:
        0 0 20px #008cff,
        0 0 50px rgba(0,140,255,.6),
        inset 0 0 25px rgba(0,180,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:orbPulse 2s infinite;
}

@keyframes orbPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 20px #008cff,
        0 0 50px rgba(0,140,255,.6);
    }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 30px #00c8ff,
        0 0 80px rgba(0,140,255,.8);
    }
}

.orb-inner{
    width:75px;
    height:75px;
    border-radius:50%;
    background:radial-gradient(circle,#00d9ff,#005cff,#020611);
    box-shadow:0 0 25px #00bfff;
}

/* Chat */
.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    padding-bottom:15px;
}

.message{
    max-width:85%;
    padding:12px 15px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.45;
    font-size:14px;
    word-wrap:break-word;
}

.message.user{
    margin-left:auto;
    background:linear-gradient(135deg,#005bea,#003b9e);
    border-bottom-right-radius:4px;
    box-shadow:0 0 15px rgba(0,110,255,.25);
}

.message.kaira{
    margin-right:auto;
    background:rgba(5,25,55,.9);
    border:1px solid rgba(0,150,255,.25);
    border-bottom-left-radius:4px;
}

.message.error{
    margin-right:auto;
    background:rgba(100,0,20,.5);
    border:1px solid #ff315c;
}

/* Bottom */
.bottom{
    padding:10px 12px 14px;
    background:rgba(2,8,20,.9);
    border-top:1px solid rgba(0,150,255,.25);
    backdrop-filter:blur(15px);
}

.input-row{
    display:flex;
    gap:8px;
}

#messageInput{
    flex:1;
    min-width:0;
    height:48px;
    border:1px solid rgba(0,160,255,.35);
    outline:none;
    border-radius:14px;
    background:#061225;
    color:#fff;
    padding:0 14px;
    font-size:14px;
}

#messageInput:focus{
    border-color:#00aaff;
    box-shadow:0 0 12px rgba(0,150,255,.25);
}

button{
    border:none;
    cursor:pointer;
    color:white;
}

.action-btn{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#061a35;
    border:1px solid rgba(0,160,255,.4);
    font-size:19px;
    transition:.2s;
}

.action-btn:hover{
    background:#08366b;
    box-shadow:0 0 15px rgba(0,160,255,.5);
}

.send-btn{
    width:55px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,#008cff,#0051d4);
    font-size:18px;
    box-shadow:0 0 15px rgba(0,130,255,.35);
}

.send-btn:active,
.action-btn:active{
    transform:scale(.94);
}

.tools{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.tool-btn{
    flex:1;
    height:36px;
    border-radius:10px;
    background:#061225;
    border:1px solid rgba(0,150,255,.25);
    color:#8fcaff;
    font-size:12px;
}

/* Camera */
.camera-box{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
}

.camera-box.active{
    display:flex;
}

#cameraVideo{
    width:90%;
    max-width:500px;
    border:2px solid #00aaff;
    border-radius:16px;
    box-shadow:0 0 30px #007cff;
}

.camera-buttons{
    display:flex;
    gap:10px;
}

.camera-buttons button{
    padding:12px 18px;
    border-radius:10px;
    background:#06346a;
    border:1px solid #008cff;
}

/* Responsive */
@media(max-width:600px){
    .logo-text{
        font-size:18px;
    }

    .ai-area{
        height:160px;
    }

    .ai-orb{
        width:95px;
        height:95px;
    }

    .orb-inner{
        width:60px;
        height:60px;
    }

    .message{
        max-width:90%;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<header>
    <div class="logo">
        <div class="logo-icon">K</div>
        <div>
            <div class="logo-text">KAIRA</div>
            <div class="status">● ONLINE</div>
        </div>
    </div>

    <div class="usage" id="usageText">
        AI Usage: 0
    </div>
</header>

<div class="main">

    <div class="ai-area">
        <div class="ai-orb">
            <div class="orb-inner"></div>
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="message kaira">
            नमस्ते 👋 मैं <b>KAIRA</b> हूँ।<br>
            आप मुझसे कुछ भी पूछ सकते हो।
        </div>

    </div>

    <div class="bottom">

        <div class="input-row">

            <input
                id="messageInput"
                type="text"
                placeholder="KAIRA से कुछ पूछें..."
                autocomplete="off"
            >

            <button
                class="action-btn"
                id="voiceBtn"
                title="Voice Command"
            >
                🎤
            </button>

            <button
                class="send-btn"
                id="sendBtn"
            >
                ➤
            </button>

        </div>

        <div class="tools">

            <button
                class="tool-btn"
                id="cameraBtn"
            >
                📷 Camera
            </button>

            <button
                class="tool-btn"
                id="screenBtn"
            >
                🖥 Screen Vision
            </button>

        </div>

    </div>

</div>

<!-- Camera -->
<div class="camera-box" id="cameraBox">

    <video
        id="cameraVideo"
        autoplay
        playsinline
    ></video>

    <div class="camera-buttons">

        <button id="captureBtn">
            📸 Analyze
        </button>

        <button id="closeCameraBtn">
            ✕ Close
        </button>

    </div>

</div>

<script>

/* =========================
   KAIRA FRONTEND
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const screenBtn =
    document.getElementById("screenBtn");

const usageText =
    document.getElementById("usageText");

const cameraBox =
    document.getElementById("cameraBox");

const cameraVideo =
    document.getElementById("cameraVideo");

const captureBtn =
    document.getElementById("captureBtn");

const closeCameraBtn =
    document.getElementById("closeCameraBtn");


/* =========================
   USAGE
========================= */

let usage =
    Number(
        localStorage.getItem("kairaNormalUsage") || 0
    );

function updateUsage(){

    usageText.textContent =
        "AI Usage: " + usage;

}

updateUsage();


/* =========================
   CHAT MESSAGE
========================= */

function addMessage(text,type){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.innerHTML =
        text
        .replace(/\n/g,"<br>");

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   WEATHER
========================= */

async function getWeather(){

    try{

        if(!navigator.geolocation){
            return null;
        }

        const position =
            await new Promise(
                (resolve,reject)=>{

                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            enableHighAccuracy:false,
                            timeout:5000
                        }
                    );

                }
            );

        const lat =
            position.coords.latitude;

        const lon =
            position.coords.longitude;

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code`;

        const response =
            await fetch(url);

        if(!response.ok){
            return null;
        }

        return await response.json();

    }catch(error){

        console.log(
            "Weather unavailable"
        );

        return null;
    }

}


/* =========================
   ASK KAIRA
========================= */

async function askKaira(message,image=null){

    if(!message && !image){
        return;
    }

    addMessage(
        message || "Image analyze karo",
        "user"
    );

    const thinking =
        document.createElement("div");

    thinking.className =
        "message kaira";

    thinking.id =
        "thinking";

    thinking.innerHTML =
        "KAIRA सोच रहा है... ⚡";

    chat.appendChild(thinking);

    chat.scrollTop =
        chat.scrollHeight;

    try{

        const weather =
            await getWeather();

        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            message || "",

                        weather:
                            weather,

                        image:
                            image

                    })
                }
            );

        const data =
            await response.json();

        thinking.remove();

        if(!response.ok){

            addMessage(
                data.error ||
                "KAIRA AI में समस्या आ गई।",
                "error"
            );

            return;
        }

        usage++;

        localStorage.setItem(
            "kairaNormalUsage",
            usage
        );

        updateUsage();

        const reply =
            data.reply ||
            "मुझे कोई जवाब नहीं मिला।";

        addMessage(
            reply,
            "kaira"
        );

        speak(reply);

    }catch(error){

        thinking.remove();

        addMessage(
            "Server से connection नहीं हो पाया। कृपया Vercel deployment check करें।",
            "error"
        );

        console.error(error);

    }

}


/* =========================
   SEND
========================= */

function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    input.value = "";

    askKaira(text);

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            sendMessage();
        }

    }
);


/* =========================
   SPEECH OUTPUT
========================= */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    try{

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang =
            "hi-IN";

        utterance.rate =
            1;

        utterance.pitch =
            1;

        window.speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.log(
            "Speech output unavailable"
        );

    }

}
    /* =========================
   VOICE COMMAND
========================= */

let recognition = null;
let isListening = false;

if (
    "SpeechRecognition" in window ||
    "webkitSpeechRecognition" in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "hi-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart = function(){

        isListening = true;

        voiceBtn.textContent =
            "🔴";

        addMessage(
            "🎤 बोलिए, KAIRA सुन रहा है...",
            "kaira"
        );

    };

    recognition.onresult =
        function(event){

            const text =
                event.results[0][0].transcript;

            input.value = text;

            isListening = false;

            voiceBtn.textContent =
                "🎤";

            askKaira(text);

        };

    recognition.onerror =
        function(event){

            console.log(
                "Voice error:",
                event.error
            );

            isListening = false;

            voiceBtn.textContent =
                "🎤";

            if(event.error === "not-allowed"){

                addMessage(
                    "🎤 Microphone permission allow करें।",
                    "error"
                );

            }else if(event.error === "no-speech"){

                addMessage(
                    "🎤 कोई आवाज़ नहीं मिली। फिर से कोशिश करें।",
                    "error"
                );

            }

        };

    recognition.onend =
        function(){

            isListening = false;

            voiceBtn.textContent =
                "🎤";

        };

}


voiceBtn.addEventListener(
    "click",
    function(){

        if(!recognition){

            addMessage(
                "इस browser में Voice Recognition supported नहीं है।",
                "error"
            );

            return;
        }

        if(isListening){

            try{
                recognition.stop();
            }catch(error){}

            return;
        }

        try{

            recognition.start();

        }catch(error){

            console.log(error);

            isListening = false;

            voiceBtn.textContent =
                "🎤";

        }

    }
);


/* =========================
   CAMERA VISION
========================= */

let cameraStream = null;


/* Open Camera */

cameraBtn.addEventListener(
    "click",
    async function(){

        try{

            cameraStream =
                await navigator.mediaDevices.getUserMedia({
                    video:true,
                    audio:false
                });

            cameraVideo.srcObject =
                cameraStream;

            cameraBox.classList.add(
                "active"
            );

        }catch(error){

            console.error(error);

            addMessage(
                "📷 Camera permission allow नहीं हुई।",
                "error"
            );

        }

    }
);


/* Close Camera */

closeCameraBtn.addEventListener(
    "click",
    function(){

        stopCamera();

    }
);


function stopCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }

    cameraVideo.srcObject =
        null;

    cameraBox.classList.remove(
        "active"
    );

}


/* Capture Camera Image */

captureBtn.addEventListener(
    "click",
    function(){

        if(!cameraVideo.videoWidth){

            addMessage(
                "📷 Camera अभी तैयार नहीं है।",
                "error"
            );

            return;
        }

        const canvas =
            document.createElement("canvas");

        canvas.width =
            cameraVideo.videoWidth;

        canvas.height =
            cameraVideo.videoHeight;

        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            cameraVideo,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.8
            );

        stopCamera();

        askKaira(
            "इस camera image को ध्यान से analyze करके बताओ कि इसमें क्या दिखाई दे रहा है।",
            image
        );

    }
);


/* =========================
   SCREEN VISION
========================= */

screenBtn.addEventListener(
    "click",
    async function(){

        if(!navigator.mediaDevices ||
           !navigator.mediaDevices.getDisplayMedia){

            addMessage(
                "🖥 इस device/browser में Screen Vision supported नहीं है।",
                "error"
            );

            return;
        }

        let screenStream = null;

        try{

            screenStream =
                await navigator.mediaDevices.getDisplayMedia({
                    video:true,
                    audio:false
                });

            const video =
                document.createElement("video");

            video.srcObject =
                screenStream;

            video.muted =
                true;

            await video.play();

            await new Promise(
                resolve =>
                    setTimeout(resolve,500)
            );

            const canvas =
                document.createElement("canvas");

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const image =
                canvas.toDataURL(
                    "image/jpeg",
                    0.8
                );

            screenStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            askKaira(
                "इस screen को ध्यान से देखकर बताओ कि इसमें क्या दिखाई दे रहा है और मुझे क्या करना चाहिए।",
                image
            );

        }catch(error){

            console.error(
                "Screen Vision:",
                error
            );

            if(screenStream){

                screenStream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

            }

            addMessage(
                "🖥 Screen Vision cancel या unavailable है।",
                "error"
            );

        }

    }
);


/* =========================
   PAGE START
========================= */

window.addEventListener(
    "load",
    function(){

        input.focus();

        console.log(
            "KAIRA AI Frontend Loaded"
        );

    }
);

</script>

</body>
</html>
