<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIRA AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #202123;
            min-height: 100vh;
        }

        header {
            height: 60px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .usage {
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            color: #16a34a;
        }

        #chatArea {
            max-width: 850px;
            margin: auto;
            padding: 25px 16px 150px;
        }

        .welcome {
            text-align: center;
            padding: 90px 10px 40px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 16px;
        }

        .message {
            display: flex;
            margin: 18px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.kaira {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #f1f1f1;
            border-bottom-right-radius: 5px;
        }

        .kaira .bubble {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 5px;
        }

        .bottom-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid #e5e5e5;
            padding: 10px 12px 14px;
            z-index: 20;
        }

        .input-area {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 22px;
            padding: 7px 8px 7px 14px;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #111827;
            min-width: 0;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 19px;
            flex-shrink: 0;
        }

        .send-button {
            background: #111827;
            color: white;
        }

        .voice-active {
            background: #dc2626 !important;
            color: white;
        }

        .mode-text {
            max-width: 850px;
            margin: 6px auto 0;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }

        #usagePanel {
            display: none;
            position: fixed;
            top: 65px;
            right: 12px;
            width: 240px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            z-index: 50;
        }

        #usagePanel h3 {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .usage-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .usage-value {
            font-weight: bold;
        }

        .reset-button {
            width: 100%;
            margin-top: 12px;
            padding: 9px;
            border: none;
            border-radius: 10px;
            background: #f3f4f6;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            header {
                height: 55px;
            }

            .logo {
                font-size: 20px;
            }

            .header-right {
                gap: 9px;
            }

            .usage {
                font-size: 11px;
            }

            .status {
                font-size: 10px;
            }

            #chatArea {
                padding: 15px 10px 145px;
            }

            .welcome {
                padding-top: 100px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .bubble {
                max-width: 88%;
                font-size: 15px;
            }

            .input-area {
                border-radius: 20px;
            }

            #messageInput {
                font-size: 15px;
            }

            #usagePanel {
                right: 8px;
                width: 220px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        KAIRA
    </div>

    <div class="header-right">

        <div
            class="usage"
            id="usage"
            onclick="toggleUsagePanel()">
            📊 0
        </div>

        <div class="status">
            ● ONLINE
        </div>

    </div>

</header>


<div id="usagePanel">

    <h3>📊 KAIRA Usage</h3>

    <div class="usage-row">
        <span>💬 Normal</span>
        <span class="usage-value" id="normalUsage">0</span>
    </div>

    <div class="usage-row">
        <span>👁️ Vision</span>
        <span class="usage-value" id="visionUsage">0</span>
    </div>

    <div class="usage-row">
        <span>🔢 Total</span>
        <span class="usage-value" id="totalUsage">0</span>
    </div>

    <button
        class="reset-button"
        onclick="resetUsage()">
        🗑️ Counter Reset
    </button>

</div>


<main id="chatArea">

    <div
        class="welcome"
        id="welcome">

        <h1>कैसे मदद करूँ?</h1>

        <p>
            मैं Kaira हूँ। आप मुझसे बात कर सकते हैं।
        </p>

    </div>

</main>


<div class="bottom-area">

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Kaira से पूछें..."
            autocomplete="off"
        >

        <button
            id="voiceBtn"
            class="icon-button"
            onclick="startVoice()"
            title="Voice">
            🎙️
        </button>

        <button
            class="icon-button send-button"
            onclick="askKaira()"
            title="Send">
            ➤
        </button>

    </div>

    <div
        class="mode-text"
        id="modeText">
        Text mode • 🎙️ दबाकर voice में बात करें
    </div>

</div>


<script>

const input =
    document.getElementById("messageInput");

const chatArea =
    document.getElementById("chatArea");

const welcome =
    document.getElementById("welcome");

const voiceBtn =
    document.getElementById("voiceBtn");

const modeText =
    document.getElementById("modeText");


/* =========================
   USAGE
========================= */

let normalUsage =
    Number(
        localStorage.getItem("kairaNormalUsage") || 0
    );

let visionUsage =
    Number(
        localStorage.getItem("kairaVisionUsage") || 0
    );


function updateUsage() {

    const total =
        normalUsage + visionUsage;

    document.getElementById("usage").innerText =
        "📊 " + total;

    document.getElementById("normalUsage").innerText =
        normalUsage;

    document.getElementById("visionUsage").innerText =
        visionUsage;

    document.getElementById("totalUsage").innerText =
        total;
}


function countRequest(isVision = false) {

    if (isVision) {

        visionUsage++;

        localStorage.setItem(
            "kairaVisionUsage",
            visionUsage
        );

    } else {

        normalUsage++;

        localStorage.setItem(
            "kairaNormalUsage",
            normalUsage
        );

    }

    updateUsage();
}


function toggleUsagePanel() {

    const panel =
        document.getElementById("usagePanel");

    panel.style.display =
        panel.style.display === "block"
            ? "none"
            : "block";
}


function resetUsage() {

    if (
        !confirm(
            "क्या आप KAIRA usage counter reset करना चाहते हैं?"
        )
    ) {
        return;
    }

    normalUsage = 0;
    visionUsage = 0;

    localStorage.removeItem(
        "kairaNormalUsage"
    );

    localStorage.removeItem(
        "kairaVisionUsage"
    );

    updateUsage();
}


updateUsage();


/* =========================
   CHAT MESSAGE
========================= */

function addMessage(text, type) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerText =
        text;

    message.appendChild(bubble);

    chatArea.appendChild(message);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


/* =====================================================
   WEATHER + LOCATION
===================================================== */

function isWeatherQuery(text) {

    const words = [
        "मौसम",
        "आज का मौसम",
        "आज का वेदर",
        "weather",
        "today weather",
        "temperature",
        "तापमान",
        "बारिश",
        "बारिस",
        "rain",
        "हवा",
        "humidity",
        "नमी"
    ];

    const lower =
        text.toLowerCase();

    return words.some(word =>
        lower.includes(word.toLowerCase())
    );
}

/* =====================================================
   GET KAIRA LOCATION
===================================================== */

function getUserLocation() {

    return new Promise(function(resolve, reject) {

        /* पहले saved location check करें */

        const savedLat =
            localStorage.getItem(
                "kairaLatitude"
            );

        const savedLon =
            localStorage.getItem(
                "kairaLongitude"
            );


        if (
            savedLat &&
            savedLon
        ) {

            resolve({

                latitude:
                    Number(savedLat),

                longitude:
                    Number(savedLon)
            });

            return;
        }


        /* अगर location saved नहीं है */

        if (
            !navigator.geolocation
        ) {

            reject(
                new Error(
                    "Location उपलब्ध नहीं है।"
                )
            );

            return;
        }


        modeText.innerText =
            "📍 Location permission मांगी जा रही है...";


        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                /* Location save करें */

                localStorage.setItem(
                    "kairaLatitude",
                    lat
                );

                localStorage.setItem(
                    "kairaLongitude",
                    lon
                );


                modeText.innerText =
                    "📍 Location मिल गई";


                resolve({

                    latitude:
                        lat,

                    longitude:
                        lon
                });
            },


            function(error) {

                console.error(
                    "Location Error:",
                    error
                );


                modeText.innerText =
                    "📍 Location नहीं मिली";


                reject(error);
            },


            {

                enableHighAccuracy:
                    true,

                timeout:
                    15000,

                maximumAge:
                    0
            }
        );

    });
}

    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {

            reject(
                new Error(
                    "इस Browser में Location supported नहीं है।"
                )
            );

            return;
        }

        navigator.geolocation.getCurrentPosition(

            position => {

                resolve({

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude

                });

            },

            error => {

                reject(error);

            },

            {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 300000
            }

        );

    });
}


async function getWeather(latitude, longitude) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" +
        encodeURIComponent(latitude) +
        "&longitude=" +
        encodeURIComponent(longitude) +
        "&current=" +
        "temperature_2m," +
        "relative_humidity_2m," +
        "apparent_temperature," +
        "precipitation," +
        "weather_code," +
        "wind_speed_10m" +
        "&timezone=auto";

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Weather API error"
        );
    }

    return await response.json();
}


function weatherDescription(code) {

    const weather = {

        0: "आसमान साफ है",
        1: "मुख्य रूप से साफ है",
        2: "आंशिक रूप से बादल हैं",
        3: "बादल छाए हुए हैं",
        45: "कोहरा है",
        48: "कोहरा है",
        51: "हल्की बूंदाबांदी है",
        53: "बूंदाबांदी हो रही है",
        55: "तेज बूंदाबांदी हो रही है",
        61: "हल्की बारिश हो रही है",
        63: "बारिश हो रही है",
        65: "तेज बारिश हो रही है",
        71: "हल्की बर्फबारी हो रही है",
        73: "बर्फबारी हो रही है",
        75: "तेज बर्फबारी हो रही है",
        80: "हल्की बारिश की बौछारें हैं",
        81: "बारिश की बौछारें हैं",
        82: "तेज बारिश की बौछारें हैं",
        95: "गरज के साथ बारिश हो सकती है",
        96: "गरज के साथ बारिश और ओले हो सकते हैं",
        99: "गरज के साथ बारिश और ओले हो सकते हैं"

    };

    return (
        weather[code] ||
        "मौसम की स्थिति उपलब्ध नहीं है"
    );
}


async function getWeatherContext() {

    try {

        modeText.innerText =
            "📍 Location पता की जा रही है...";

        const location =
            await getUserLocation();

        modeText.innerText =
            "🌦️ Live weather लिया जा रहा है...";

        const weather =
            await getWeather(
                location.latitude,
                location.longitude
            );

        const current =
            weather.current;

        return {

            latitude:
                location.latitude,

            longitude:
                location.longitude,

            temperature:
                current.temperature_2m,

            humidity:
                current.relative_humidity_2m,

            apparentTemperature:
                current.apparent_temperature,

            precipitation:
                current.precipitation,

            windSpeed:
                current.wind_speed_10m,

            weatherCode:
                current.weather_code,

            description:
                weatherDescription(
                    current.weather_code
                )

        };

    } catch (error) {

        console.error(
            "Weather Error:",
            error
        );

        return null;
    }
} 
    /* =====================================================
   TEXT CHAT
===================================================== */

async function askKaira() {

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        message,
        "user"
    );

    input.value = "";

    countRequest(false);

    modeText.innerText =
        "🧠 KAIRA सोच रही है...";

    try {

        let weather = null;

        /* =========================
           WEATHER CHECK
        ========================= */

        if (isWeatherQuery(message)) {

            weather =
                await getWeatherContext();

            if (!weather) {

                addMessage(
                    "बॉस, मौसम बताने के लिए Location permission चाहिए। कृपया Location Allow करें।",
                    "kaira"
                );

                modeText.innerText =
                    "Text mode • 🎙️ दबाकर voice में बात करें";

                return;
            }
        }


        /* =========================
           SEND TO KAIRA API
        ========================= */

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            weather:
                                weather

                        })
                }
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            data.error ||
            "Kaira से जवाब नहीं मिला।";


        addMessage(
            reply,
            "kaira"
        );


        modeText.innerText =
            weather
                ? "🌦️ Weather mode"
                : "Text mode • 🎙️ दबाकर voice में बात करें";


    } catch (error) {

        console.error(
            "Text API Error:",
            error
        );

        addMessage(
            "Kaira से connection नहीं हो पाया।",
            "kaira"
        );

        modeText.innerText =
            "Text mode • 🎙️ दबाकर voice में बात करें";
    }
}


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            askKaira();
        }
    }
);


/* =====================================================
   KAIRA SPEAK
===================================================== */

function speakKaira(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang =
        "hi-IN";

    speech.rate =
        0.95;

    speech.pitch =
        1;

    window.speechSynthesis.speak(
        speech
    );
}


/* =====================================================
   CAMERA
===================================================== */

let cameraStream = null;


async function captureCurrentFrame() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera supported नहीं है।"
            );
        }


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "user"
                    }

                },

                audio: false

            });


        const video =
            document.createElement(
                "video"
            );


        video.srcObject =
            cameraStream;

        video.playsInline =
            true;

        video.muted =
            true;


        await video.play();


        await new Promise(resolve => {

            if (
                video.readyState >= 2
            ) {

                resolve();

            } else {

                video.onloadeddata =
                    resolve;

            }

        });


        await new Promise(resolve =>
            setTimeout(
                resolve,
                500
            )
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            video.videoWidth || 640;

        canvas.height =
            video.videoHeight || 480;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.65
            );


        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            cameraStream = null;
        }


        return image;


    } catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            cameraStream = null;
        }


        return null;
    }
}


/* =====================================================
   VISION DETECTION
===================================================== */

function needsVision(text) {

    const words = [

        "देखो",
        "देख",
        "सामने",
        "मुझे देख",
        "चेहरा",
        "क्या दिखाई",
        "क्या दिख",
        "पहचानो",
        "तस्वीर",
        "फोटो",
        "image",
        "camera",
        "कैमरा",
        "analysis",
        "analyze",
        "चार्ट देख",
        "चार्ट",
        "स्क्रीन देख",
        "स्क्रीन",
        "screen",
        "trading chart"

    ];


    const lower =
        text.toLowerCase();


    return words.some(
        word =>
            lower.includes(
                word.toLowerCase()
            )
    );
}


/* =====================================================
   VOICE ASSISTANT
===================================================== */

let recognition = null;

let listening = false;


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "इस Browser में Voice Recognition उपलब्ध नहीं है। Chrome इस्तेमाल करें।"
        );

        return;
    }


    if (listening) {

        if (recognition) {
            recognition.stop();
        }

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "hi-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    listening = true;


    voiceBtn.classList.add(
        "voice-active"
    );


    voiceBtn.innerText =
        "⏹️";


    modeText.innerText =
        "🎙️ सुन रही हूँ...";


    recognition.onresult =
        async function(event) {

            const spokenText =
                event.results[0][0]
                    .transcript
                    .trim();


            if (!spokenText) {
                return;
            }


            const visionMode =
                needsVision(
                    spokenText
                );


            const weatherMode =
                isWeatherQuery(
                    spokenText
                );


            let image = null;

            let weather = null;


            /* =========================
               CAMERA VISION
            ========================= */

            if (visionMode) {

                countRequest(true);

                modeText.innerText =
                    "📷 Camera से देख रही हूँ...";


                image =
                    await captureCurrentFrame();


                if (!image) {

                    modeText.innerText =
                        "Text mode • 🎙️ दबाकर voice में बात करें";


                    speakKaira(
                        "बॉस, Camera permission नहीं मिली। Camera की permission Allow करें।"
                    );


                    return;
                }
            }


            /* =========================
               WEATHER
            ========================= */

            if (weatherMode) {

                modeText.innerText =
                    "📍 Location पता की जा रही है...";


                weather =
                    await getWeatherContext();


                if (!weather) {

                    modeText.innerText =
                        "Text mode • 🎙️ दबाकर voice में बात करें";


                    speakKaira(
                        "बॉस, मौसम बताने के लिए Location permission चाहिए। कृपया Location Allow करें।"
                    );


                    return;
                }
            }


            /* =========================
               NORMAL VOICE COUNT
            ========================= */

            if (!visionMode) {

                countRequest(false);

            }


            try {

                modeText.innerText =
                    visionMode
                        ? "👁️ KAIRA देख रही है..."
                        : weatherMode
                            ? "🌦️ KAIRA मौसम देख रही है..."
                            : "🧠 KAIRA सोच रही है...";


                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    message:
                                        spokenText,

                                    image:
                                        image,

                                    weather:
                                        weather

                                })

                        }
                    );


                const data =
                    await response.json();


                const reply =
                    data.reply ||
                    data.error ||
                    "Kaira से जवाब नहीं मिला।";


                /*
                 * Voice में user की बात
                 * chat में दिखाई नहीं जाएगी।
                 */

                addMessage(
                    reply,
                    "kaira"
                );


                speakKaira(
                    reply
                );


                modeText.innerText =
                    visionMode
                        ? "📷 Vision mode • 🎙️ फिर बोलें"
                        : weatherMode
                            ? "🌦️ Weather mode • 🎙️ फिर बोलें"
                            : "Voice mode • 🎙️ फिर बोलें";


            } catch (error) {

                console.error(
                    "Voice API Error:",
                    error
                );


                const errorText =
                    "Kaira से connection नहीं हो पाया।";


                addMessage(
                    errorText,
                    "kaira"
                );


                speakKaira(
                    errorText
                );


                modeText.innerText =
                    "Voice mode • 🎙️ फिर बोलें";
            }

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice Error:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                speakKaira(
                    "बॉस, Microphone permission Allow करनी होगी।"
                );

            } else if (
                event.error ===
                "no-speech"
            ) {

                modeText.innerText =
                    "🎙️ कोई आवाज़ नहीं मिली। फिर से बोलें।";

            } else {

                modeText.innerText =
                    "Voice में समस्या आई। फिर से कोशिश करें।";
            }
        };


    recognition.onend =
        function() {

            listening = false;

            voiceBtn.classList.remove(
                "voice-active"
            );

            voiceBtn.innerText =
                "🎙️";
        };


    recognition.start();
    } 
    /* =====================================================
   SCREEN VISION
===================================================== */

async function captureScreenFrame() {

    let screenStream = null;

    try {

    screenStream =
    await navigator.mediaDevices.getDisplayMedia({

        video: true,

        audio: false
    });


        const video =
            document.createElement("video");


        video.srcObject =
            screenStream;

        video.playsInline =
            true;

        video.muted =
            true;


        await video.play();


        await new Promise(resolve =>
            setTimeout(resolve, 700)
        );


        const canvas =
            document.createElement("canvas");


        canvas.width =
            video.videoWidth || 1280;

        canvas.height =
            video.videoHeight || 720;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.65
            );


        screenStream
            .getTracks()
            .forEach(track =>
                track.stop()
            );


        return image;

    } catch (error) {

        console.error(
            "Screen Error:",
            error
        );


        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(track =>
                    track.stop()
                );
        }


        return null;
    }
}


/* =====================================================
   SCREEN ANALYSIS
===================================================== */

async function analyzeScreen() {

    countRequest(true);

    modeText.innerText =
        "🖥️ Screen share शुरू करें...";

    const image =
        await captureScreenFrame();

    if (!image) {

        modeText.innerText =
            "Text mode • 🎙️ दबाकर voice में बात करें";

        return;
    }

    modeText.innerText =
        "👁️ KAIRA आपकी screen देख रही है...";

    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                "बॉस ने अपनी screen share की है। इस स्क्रीन को ध्यान से देखकर बताओ कि इसमें क्या दिखाई दे रहा है। अगर TradingView या कोई trading chart दिखाई दे रहा है तो trend, support, resistance और दिखाई देने वाले technical observations सरल हिंदी में समझाओ। निश्चित profit या guaranteed prediction मत दो।",

                            image:
                                image

                        })
                }
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            data.error ||
            "Screen का analysis नहीं हो पाया।";


        addMessage(
            reply,
            "kaira"
        );


        speakKaira(
            reply
        );


        modeText.innerText =
            "🖥️ Screen Vision • 🎙️ फिर बोलें";


    } catch (error) {

        console.error(
            "Screen API Error:",
            error
        );


        addMessage(
            "Screen analysis में समस्या आ गई।",
            "kaira"
        );


        modeText.innerText =
            "Text mode • 🎙️ दबाकर voice में बात करें";
    }
}

===================================================== */

function createScreenButton() {

    if (
        document.getElementById(
            "screenVisionBtn"
        )
    ) {
        return;
    }


    const button =
        document.createElement("button");


    button.id =
        "screenVisionBtn";


    button.className =
        "icon-button";


    button.innerText =
        "🖥️";


    button.title =
        "Screen Vision";


    button.onclick =
        analyzeScreen;


    voiceBtn.parentNode.insertBefore(
        button,
        voiceBtn
    );
}


createScreenButton();
