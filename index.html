<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIRA AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #202123;
            min-height: 100vh;
        }

        header {
            height: 60px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status {
            font-size: 12px;
            color: #16a34a;
        }

        #chatArea {
            max-width: 850px;
            margin: auto;
            padding: 25px 16px 150px;
        }

        .welcome {
            text-align: center;
            padding: 90px 10px 40px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 16px;
        }

        .message {
            display: flex;
            margin: 18px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.kaira {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #f1f1f1;
            border-bottom-right-radius: 5px;
        }

        .kaira .bubble {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 5px;
        }

        /* CAMERA */

        #cameraBox {
            display: none;
            max-width: 850px;
            margin: 0 auto 100px;
            padding: 15px;
            text-align: center;
        }

        #cameraVideo {
            width: 100%;
            max-width: 500px;
            border-radius: 18px;
            background: #000;
        }

        .camera-buttons {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .camera-buttons button {
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
        }

        /* BOTTOM BAR */

        .bottom-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid #e5e5e5;
            padding: 10px 12px 14px;
            z-index: 20;
        }

        .input-area {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 22px;
            padding: 7px 8px 7px 14px;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #111827;
            min-width: 0;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 19px;
            flex-shrink: 0;
        }

        .send-button {
            background: #111827;
            color: white;
        }

        .voice-active {
            background: #dc2626 !important;
            color: white;
        }

        .mode-text {
            max-width: 850px;
            margin: 6px auto 0;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            header {
                height: 55px;
            }

            .logo {
                font-size: 20px;
            }

            #chatArea {
                padding: 15px 10px 145px;
            }

            .welcome {
                padding-top: 100px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .bubble {
                max-width: 88%;
                font-size: 15px;
            }

            .input-area {
                border-radius: 20px;
            }

            #messageInput {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            KAIRA
        </div>

        <div class="status">
            ● ONLINE
        </div>

    </header>


    <!-- CHAT -->

    <main id="chatArea">

        <div class="welcome" id="welcome">

            <h1>कैसे मदद करूँ?</h1>

            <p>
                मैं Kaira हूँ। आप मुझसे बात कर सकते हैं।
            </p>

        </div>

    </main>


    <!-- CAMERA -->

    <section id="cameraBox">

        <video
            id="cameraVideo"
            autoplay
            playsinline>
        </video>

        <div class="camera-buttons">

            <button onclick="analyzeCamera()">
                👁️ Kaira से Analyze करवाएँ
            </button>

            <button onclick="closeCamera()">
                कैमरा बंद करें
            </button>

        </div>

    </section>


    <!-- BOTTOM INPUT -->

    <div class="bottom-area">

        <div class="input-area">

            <button
                class="icon-button"
                onclick="openCamera()"
                title="Camera">
                📷
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Kaira से पूछें..."
                autocomplete="off"
            >

            <button
                id="voiceBtn"
                class="icon-button"
                onclick="startVoice()"
                title="Voice">
                🎙️
            </button>

            <button
                class="icon-button send-button"
                onclick="askKaira()"
                title="Send">
                ➤
            </button>

        </div>

        <div class="mode-text" id="modeText">
            Text mode • 🎙️ दबाकर voice में बात करें
        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const input =
            document.getElementById("messageInput");

        const chatArea =
            document.getElementById("chatArea");

        const welcome =
            document.getElementById("welcome");

        const voiceBtn =
            document.getElementById("voiceBtn");

        const modeText =
            document.getElementById("modeText");


        /* =========================
           ADD CHAT MESSAGE
        ========================= */

        function addMessage(text, type) {

            if (welcome) {
                welcome.style.display = "none";
            }

            const message =
                document.createElement("div");

            message.className =
                "message " + type;

            const bubble =
                document.createElement("div");

            bubble.className = "bubble";

            bubble.innerText = text;

            message.appendChild(bubble);

            chatArea.appendChild(message);

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });
        }


        /* =========================
           TEXT CHAT
        ========================= */

        async function askKaira() {

            const message =
                input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            try {

                const response =
                    await fetch("/api/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });

                const data =
                    await response.json();

                const reply =
                    data.reply ||
                    data.error ||
                    "Kaira से जवाब नहीं मिला।";

                addMessage(reply, "kaira");

            } catch (error) {

                console.error(error);

                addMessage(
                    "Kaira से connection नहीं हो पाया।",
                    "kaira"
                );

            }

        }


        /* =========================
           ENTER TO SEND
        ========================= */

        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    askKaira();

                }

            }
        );


        /* =========================
           KAIRA VOICE
        ========================= */

        function speakKaira(text) {

            if (!("speechSynthesis" in window)) {
                return;
            }

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "hi-IN";
            speech.rate = 0.95;
            speech.pitch = 1;

            window.speechSynthesis.speak(speech);

        }


        /* =========================
           VOICE ASSISTANT
        ========================= */

        let recognition = null;

        let voiceMode = false;


        function startVoice() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {

                alert(
                    "आपके browser में Voice Assistant support नहीं है।"
                );

                return;

            }

            voiceMode = true;

            voiceBtn.classList.add(
                "voice-active"
            );

            voiceBtn.innerText = "🔴";

            modeText.innerText =
                "Voice mode • Kaira सुन रही है...";

            recognition =
                new SpeechRecognition();

            recognition.lang = "hi-IN";
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.start();


            recognition.onresult =
                async function(event) {

                    const spokenText =
                        event.results[0][0]
                        .transcript;

                    modeText.innerText =
                        "Voice mode • Kaira जवाब दे रही है...";

                    try {

                        const response =
                            await fetch("/api/chat", {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message: spokenText
                                })

                            });

                        const data =
                            await response.json();

                        const reply =
                            data.reply ||
                            data.error ||
                            "Kaira से जवाब नहीं मिला।";

                        speakKaira(reply);

                        modeText.innerText =
                            "Voice mode • 🎙️ बोलने के लिए फिर दबाएँ";

                    } catch (error) {

                        console.error(error);

                        speakKaira(
                            "माफ़ कीजिए, अभी connection में समस्या है।"
                        );

                        modeText.innerText =
                            "Voice mode • Connection समस्या";

                    }

                };


            recognition.onerror =
                function() {

                    voiceMode = false;

                    voiceBtn.classList.remove(
                        "voice-active"
                    );

                    voiceBtn.innerText = "🎙️";

                    modeText.innerText =
                        "Microphone में समस्या हुई। Permission check करें।";

                };


            recognition.onend =
                function() {

                    voiceMode = false;

                    voiceBtn.classList.remove(
                        "voice-active"
                    );

                    voiceBtn.innerText = "🎙️";

                    modeText.innerText =
                        "Text mode • 🎙️ दबाकर voice में बात करें";

                };

        }


        /* =========================
           CAMERA
        ========================= */

        let cameraStream = null;


        async function openCamera() {

            const cameraBox =
                document.getElementById("cameraBox");

            const video =
                document.getElementById("cameraVideo");

            try {

                cameraStream =
                    await navigator.mediaDevices
                    .getUserMedia({

                        video: true,
                        audio: false

                    });

                video.srcObject =
                    cameraStream;

                cameraBox.style.display =
                    "block";

                modeText.innerText =
                    "📷 Camera चालू है";

            } catch (error) {

                console.error(error);

                alert(
                    "Camera permission नहीं मिली। कृपया Allow करें।"
                );

            }

        }


        /* =========================
           CLOSE CAMERA
        ========================= */

        function closeCamera() {

            const cameraBox =
                document.getElementById("cameraBox");

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

                cameraStream = null;

            }

            cameraBox.style.display =
                "none";

            modeText.innerText =
                "Text mode • 🎙️ दबाकर voice में बात करें";

        }


        /* =========================
           CAMERA VISION
        ========================= */

        async function analyzeCamera() {

            const video =
                document.getElementById("cameraVideo");

            if (!cameraStream) {

                alert(
                    "पहले Camera चालू करो।"
                );

                return;
            }

            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                alert(
                    "Camera अभी तैयार नहीं है। 1-2 सेकंड रुकें।"
                );

                return;
            }

            try {

                modeText.innerText =
                    "👁️ Kaira camera देख रही है...";

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                const image =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.8
                    );


                const response =
                    await fetch("/api/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message:
                                "इस तस्वीर को ध्यान से देखकर बताओ कि इसमें क्या दिखाई दे रहा है। केवल साफ दिखाई देने वाली चीजों के बारे में सरल और natural हिंदी में जवाब दो। अगर कोई वस्तु, व्यक्ति, टेक्स्ट या दूसरी जानकारी दिखाई दे रही है तो उसका analysis करो।",

                            image: image

                        })

                    });


                const data =
                    await response.json();


                const reply =
                    data.reply ||
                    data.error ||
                    "Kaira image को समझ नहीं पाई।";


                addMessage(
                    reply,
                    "kaira"
                );


                modeText.innerText =
                    "📷 Camera चालू है";


            } catch (error) {

                console.error(error);

                addMessage(
                    "माफ़ कीजिए बॉस, अभी camera analysis में समस्या आई।",
                    "kaira"
                );

                modeText.innerText =
                    "📷 Camera चालू है";

            }

        }


        /* =========================
           WELCOME
        ========================= */

        setTimeout(
            function() {

                /*
                 Browser permission/autoplay rules के कारण
                 Kaira खुद से voice शुरू नहीं करेगी.
                */

            },
            500
        );

    </script>

</body>
</html>
