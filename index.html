<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIRA AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #202123;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 60px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .usage {
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            color: #16a34a;
        }


        /* =========================
           CHAT
        ========================= */

        #chatArea {
            max-width: 850px;
            margin: auto;
            padding: 25px 16px 150px;
        }

        .welcome {
            text-align: center;
            padding: 90px 10px 40px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 16px;
        }

        .message {
            display: flex;
            margin: 18px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.kaira {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #f1f1f1;
            border-bottom-right-radius: 5px;
        }

        .kaira .bubble {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 5px;
        }


        /* =========================
           BOTTOM BAR
        ========================= */

        .bottom-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid #e5e5e5;
            padding: 10px 12px 14px;
            z-index: 20;
        }

        .input-area {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 22px;
            padding: 7px 8px 7px 14px;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #111827;
            min-width: 0;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 19px;
            flex-shrink: 0;
        }

        .send-button {
            background: #111827;
            color: white;
        }

        .voice-active {
            background: #dc2626 !important;
            color: white;
        }

        .mode-text {
            max-width: 850px;
            margin: 6px auto 0;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }


        /* =========================
           USAGE PANEL
        ========================= */

        #usagePanel {
            display: none;
            position: fixed;
            top: 65px;
            right: 12px;
            width: 240px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            z-index: 50;
        }

        #usagePanel h3 {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .usage-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .usage-value {
            font-weight: bold;
        }

        .reset-button {
            width: 100%;
            margin-top: 12px;
            padding: 9px;
            border: none;
            border-radius: 10px;
            background: #f3f4f6;
            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 55px;
            }

            .logo {
                font-size: 20px;
            }

            .header-right {
                gap: 9px;
            }

            .usage {
                font-size: 11px;
            }

            .status {
                font-size: 10px;
            }

            #chatArea {
                padding: 15px 10px 145px;
            }

            .welcome {
                padding-top: 100px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .bubble {
                max-width: 88%;
                font-size: 15px;
            }

            .input-area {
                border-radius: 20px;
            }

            #messageInput {
                font-size: 15px;
            }

            #usagePanel {
                right: 8px;
                width: 220px;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        KAIRA
    </div>

    <div class="header-right">

        <div
            class="usage"
            id="usage"
            onclick="toggleUsagePanel()">
            📊 0
        </div>

        <div class="status">
            ● ONLINE
        </div>

    </div>

</header>


<!-- =========================
     USAGE PANEL
========================= -->

<div id="usagePanel">

    <h3>📊 KAIRA Usage</h3>

    <div class="usage-row">
        <span>💬 Normal</span>
        <span
            class="usage-value"
            id="normalUsage">
            0
        </span>
    </div>

    <div class="usage-row">
        <span>👁️ Vision</span>
        <span
            class="usage-value"
            id="visionUsage">
            0
        </span>
    </div>

    <div class="usage-row">
        <span>🔢 Total</span>
        <span
            class="usage-value"
            id="totalUsage">
            0
        </span>
    </div>

    <button
        class="reset-button"
        onclick="resetUsage()">
        🗑️ Counter Reset
    </button>

</div>


<!-- =========================
     CHAT
========================= -->

<main id="chatArea">

    <div
        class="welcome"
        id="welcome">

        <h1>कैसे मदद करूँ?</h1>

        <p>
            मैं Kaira हूँ। आप मुझसे बात कर सकते हैं।
        </p>

    </div>

</main>


<!-- =========================
     BOTTOM INPUT
========================= -->

<div class="bottom-area">

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Kaira से पूछें..."
            autocomplete="off"
        >

        <button
            id="voiceBtn"
            class="icon-button"
            onclick="startVoice()"
            title="Voice">
            🎙️
        </button>

        <button
            class="icon-button send-button"
            onclick="askKaira()"
            title="Send">
            ➤
        </button>

    </div>

    <div
        class="mode-text"
        id="modeText">
        Text mode • 🎙️ दबाकर voice में बात करें
    </div>

</div>


<script>


/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("messageInput");

const chatArea =
    document.getElementById("chatArea");

const welcome =
    document.getElementById("welcome");

const voiceBtn =
    document.getElementById("voiceBtn");

const modeText =
    document.getElementById("modeText");


/* =========================
   USAGE DATA
========================= */

let normalUsage =
    Number(
        localStorage.getItem(
            "kairaNormalUsage"
        ) || 0
    );

let visionUsage =
    Number(
        localStorage.getItem(
            "kairaVisionUsage"
        ) || 0
    );


/* =========================
   UPDATE USAGE
========================= */

function updateUsage() {

    const total =
        normalUsage +
        visionUsage;


    const usage =
        document.getElementById("usage");

    const normal =
        document.getElementById(
            "normalUsage"
        );

    const vision =
        document.getElementById(
            "visionUsage"
        );

    const totalElement =
        document.getElementById(
            "totalUsage"
        );


    if (usage) {

        usage.innerText =
            "📊 " + total;

    }


    if (normal) {

        normal.innerText =
            normalUsage;

    }


    if (vision) {

        vision.innerText =
            visionUsage;

    }


    if (totalElement) {

        totalElement.innerText =
            total;

    }

}


/* =========================
   COUNT REQUEST
========================= */

function countRequest(
    isVision = false
) {

    if (isVision) {

        visionUsage++;

        localStorage.setItem(
            "kairaVisionUsage",
            visionUsage
        );

    } else {

        normalUsage++;

        localStorage.setItem(
            "kairaNormalUsage",
            normalUsage
        );

    }

    updateUsage();

}


/* =========================
   USAGE PANEL
========================= */

function toggleUsagePanel() {

    const panel =
        document.getElementById(
            "usagePanel"
        );

    if (
        panel.style.display === "block"
    ) {

        panel.style.display = "none";

    } else {

        panel.style.display = "block";

    }

}


/* =========================
   RESET USAGE
========================= */

function resetUsage() {

    const confirmReset =
        confirm(
            "क्या आप KAIRA usage counter reset करना चाहते हैं?"
        );

    if (!confirmReset) {
        return;
    }


    normalUsage = 0;

    visionUsage = 0;


    localStorage.removeItem(
        "kairaNormalUsage"
    );

    localStorage.removeItem(
        "kairaVisionUsage"
    );


    updateUsage();

}


/* =========================
   INITIAL USAGE
========================= */

updateUsage();


/* =========================
   ADD CHAT MESSAGE
========================= */

function addMessage(
    text,
    type
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerText =
        text;


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/* =========================
   TEXT CHAT
========================= */

async function askKaira() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    /*
     * Normal Gemini request
     */

    countRequest(false);


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            data.error ||
            "Kaira से जवाब नहीं मिला।";


        addMessage(
            reply,
            "kaira"
        );


    } catch (error) {

        console.error(
            error
        );


        addMessage(

            "Kaira से connection नहीं हो पाया।",

            "kaira"

        );

    }

}


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            askKaira();

        }

    }

);


/* =========================
   KAIRA SPEAK
========================= */

function speakKaira(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "hi-IN";


    speech.rate =
        0.95;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   CAMERA FRAME
========================= */

let cameraStream = null;


async function captureCurrentFrame() {

    try {

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {

                        ideal:
                            "user"

                    }

                },

                audio:
                    false

            });


        const video =
            document.createElement(
                "video"
            );


        video.srcObject =
            cameraStream;


        video.playsInline =
            true;


        video.muted =
            true;


        await video.play();


        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadeddata =
                        resolve;

                }

            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(

            video,

            0,

            0,

            canvas.width,

            canvas.height

        );


        const image =
            canvas.toDataURL(

                "image/jpeg",

                0.70

            );


        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        cameraStream =
            null;


        return image;


    } catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        return null;

    }

}


/* =========================
   VISION DETECTION
========================= */

function needsVision(text) {

    const words = [

        "देखो",
        "देख",
        "दिख",
        "सामने",
        "मेरे सामने",
        "मुझे देख",
        "मेरा चेहरा",
        "चेहरा",
        "कैसा दिख",
        "क्या दिखाई",
        "क्या दिख",
        "पहचान",
        "पहचानो",
        "फोटो",
        "तस्वीर",
        "इमेज",
        "image",
        "camera",
        "analysis",
        "एनालिसिस",
        "चार्ट देख",
        "स्क्रीन देख",
        "स्क्रीन को देख",
        "मुझे देखकर"

    ];


    const lower =
        text.toLowerCase();


    return words.some(
        word =>
            lower.includes(
                word.toLowerCase()
            )
    );

}


/* =========================
   VOICE ASSISTANT
========================= */

let recognition =
    null;


let voiceMode =
    false;


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "आपके browser में Voice Assistant support नहीं है।"
        );

        return;

    }


    voiceMode =
        true;


    voiceBtn.classList.add(
        "voice-active"
    );


    voiceBtn.innerText =
        "🔴";


    modeText.innerText =
        "Voice mode • Kaira सुन रही है...";


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "hi-IN";


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    recognition.start();


    recognition.onresult =
        async function(event) {

            const spokenText =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            modeText.innerText =
                "Voice mode • Kaira सोच रही है...";


            /*
             * Check whether
             * camera vision is needed
             */

            const visionRequired =
                needsVision(
                    spokenText
                );


            let image =
                null;


            /* =========================
               VISION
            ========================= */

            if (
                visionRequired
            ) {

                modeText.innerText =
                    "👁️ Kaira आपको देख रही है...";


                image =
                    await captureCurrentFrame();


                if (!image) {

                    speakKaira(

                        "बॉस, camera की permission नहीं मिली। कृपया camera permission Allow करें।"

                    );


                    modeText.innerText =
                        "Voice mode • Camera permission चाहिए";


                    return;

                }

            }


            /*
             * Count request
             */

            countRequest(
                visionRequired
            );


            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                                                            body:
                                    JSON.stringify({

                                        message:
                                            spokenText,

                                        image:
                                            image

                                    })

                            }

                        );


                const data =
                    await response.json();


                const reply =
                    data.reply ||
                    data.error ||
                    "Kaira से जवाब नहीं मिला।";


                /*
                 * Voice query chat में दिखाई नहीं जाएगी
                 */

                speakKaira(reply);


                modeText.innerText =
                    "Voice mode • Kaira तैयार है";


            } catch (error) {

                console.error(
                    "Voice Error:",
                    error
                );


                speakKaira(
                    "बॉस, Kaira से connection नहीं हो पाया।"
                );


                modeText.innerText =
                    "Voice mode • Connection error";

            }


            /*
             * Voice button reset
             */

            voiceBtn.classList.remove(
                "voice-active"
            );

            voiceBtn.innerText =
                "🎙️";

            voiceMode =
                false;

        };


    recognition.onerror =
        function(error) {

            console.error(
                "Speech Recognition Error:",
                error
            );


            voiceBtn.classList.remove(
                "voice-active"
            );

            voiceBtn.innerText =
                "🎙️";


            voiceMode =
                false;


            modeText.innerText =
                "Text mode • 🎙️ दबाकर voice में बात करें";

        };


    recognition.onend =
        function() {

            voiceBtn.classList.remove(
                "voice-active"
            );

            voiceBtn.innerText =
                "🎙️";


            voiceMode =
                false;

        };

}


/* =====================================================
   SCREEN VISION
   ===================================================== */

let screenStream = null;


/*
 * Screen से एक current frame capture करना
 */

async function captureScreenFrame() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getDisplayMedia
        ) {

            throw new Error(
                "Screen sharing supported नहीं है।"
            );

        }


        modeText.innerText =
            "🖥️ Kaira आपकी screen देख रही है...";


        /*
         * Browser screen-share permission
         */

        screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {

                        frameRate: 5

                    },

                    audio: false

                });


        const video =
            document.createElement(
                "video"
            );


        video.srcObject =
            screenStream;


        video.muted =
            true;


        video.playsInline =
            true;


        await video.play();


        /*
         * Screen को render होने के लिए थोड़ा समय
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(

            video,

            0,

            0,

            canvas.width,

            canvas.height

        );


        const image =
            canvas.toDataURL(

                "image/jpeg",

                0.65

            );


        /*
         * Screen sharing बंद
         */

        screenStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        screenStream =
            null;


        return image;


    } catch (error) {

        console.error(
            "Screen Vision Error:",
            error
        );


        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        screenStream =
            null;


        return null;

    }

}


/*
 * Screen को KAIRA के पास भेजना
 */

async function analyzeScreen() {

    const image =
        await captureScreenFrame();


    if (!image) {

        speakKaira(
            "बॉस, screen share की permission नहीं मिली।"
        );


        modeText.innerText =
            "Screen Vision • Permission चाहिए";

        return;

    }


    /*
     * Vision request count
     */

    countRequest(true);


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                "बॉस ने अपनी screen share की है। इस स्क्रीन को ध्यान से देखकर बताओ कि इसमें क्या दिखाई दे रहा है। अगर TradingView या कोई trading chart दिखाई दे रहा है तो trend, support, resistance और दिखाई देने वाले technical observations सरल हिंदी में समझाओ। निश्चित profit या guaranteed prediction मत दो।",

                            image:
                                image

                        })

                }
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            data.error ||
            "KAIRA screen को समझ नहीं पाई।";


        /*
         * Screen का result chat में दिखेगा
         */

        addMessage(
            reply,
            "kaira"
        );


        /*
         * Voice में भी जवाब
         */

        speakKaira(reply);


        modeText.innerText =
            "Screen Vision • Analysis पूरा हुआ";


    } catch (error) {

        console.error(
            "Screen Analysis Error:",
            error
        );


        addMessage(
            "बॉस, screen analysis नहीं हो पाया।",
            "kaira"
        );


        speakKaira(
            "बॉस, screen analysis नहीं हो पाया।"
        );


        modeText.innerText =
            "Screen Vision • Error";

    }

}


/* =====================================================
   SCREEN VISION BUTTON
   ===================================================== */

function createScreenButton() {

    /*
     * अगर button पहले से मौजूद है
     * तो दोबारा create नहीं होगा
     */

    if (
        document.getElementById(
            "screenVisionBtn"
        )
    ) {

        return;

    }


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "screenVisionBtn";


    button.className =
        "icon-button";


    button.innerText =
        "🖥️";


    button.title =
        "Screen Vision";


    button.onclick =
        analyzeScreen;


    /*
     * Voice button के पहले button लगाना
     */

    voiceBtn.parentNode.insertBefore(
        button,
        voiceBtn
    );

}


/* =====================================================
   START
   ===================================================== */

createScreenButton();


</script>

</body>
</html>
